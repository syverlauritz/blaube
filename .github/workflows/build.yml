name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm test

  package:
    needs: test
    env:
      CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # One installer per CPU type, so each download carries a single copy of Electron.
      # With a Developer ID certificate in the repo secrets, the Mac build is
      # signed and notarized. Without one it is ad-hoc signed, which runs but
      # still needs "Open Anyway" in Privacy & Security on first launch.
      - if: runner.os == 'macOS' && env.CSC_LINK != ''
        run: npx electron-builder --mac --arm64 --x64 --publish never
      - if: runner.os == 'macOS' && env.CSC_LINK == ''
        run: npx electron-builder --mac --arm64 --x64 --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - if: runner.os == 'Windows'
        run: |
          npx electron-builder --win --x64 --publish never
          npx electron-builder --win --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: blaube-${{ runner.os }}-arm64
          path: |
            dist/*-arm64.dmg
            dist/*-arm64.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: blaube-${{ runner.os }}-x64
          path: |
            dist/*-x64.dmg
            dist/*-x64.exe
          if-no-files-found: error
