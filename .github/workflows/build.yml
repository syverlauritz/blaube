name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Run by hand on main to publish the version in package.json as a release,
  # for when a v* tag can't be pushed (the release job makes the tag).
  workflow_dispatch:

# Read-only unless a job says otherwise (only the release jobs write).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm test

  # The real app, invisible under a virtual screen, driven through fake hooks
  # (no Claude Code, no tokens): the slimes' physics and voice behaviour.
  life:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get install -y xvfb
      - run: BLAUBE_TEST=scripts/e2e/life.js BLAUBE_PORT=47872 xvfb-run -a npx electron --no-sandbox --disable-gpu-vsync --disable-frame-rate-limit .

  package:
    needs: test
    env:
      CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # With a Developer ID certificate in the repo secrets, the Mac build is
      # signed and notarized. Without one it is ad-hoc signed, which runs but
      # still needs "Open Anyway" in Privacy & Security on first launch (and
      # can't install its own updates). Both CPU types in one run, so the Mac update feed (latest-mac.yml)
      # lists both zips and Windows gets one installer for x64 and ARM.
      - if: runner.os == 'macOS' && env.CSC_LINK != ''
        run: npx electron-builder --mac --arm64 --x64 --publish never --config build/signed.config.js
      - if: runner.os == 'macOS' && env.CSC_LINK == ''
        run: npx electron-builder --mac --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --arm64 --publish never
      # What someone downloading it gets: the installer, run the way
      # install.ps1 runs it (quietly, just for this user), installs Blaube,
      # and the installed app starts and answers on its port.
      - if: runner.os == 'Windows'
        name: The Windows installer installs a Blaube that starts
        shell: pwsh
        env:
          BLAUBE_PORT: 47873
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Process -FilePath dist\Blaube-Setup-windows.exe -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\blaube\Blaube.exe'
          if (-not (Test-Path $exe)) { throw "The installer didn't put Blaube at $exe" }
          $p = Start-Process -FilePath $exe -PassThru
          $ok = $false
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 1
            if ($p.HasExited) { throw "Blaube quit by itself (exit code $($p.ExitCode))" }
            try {
              $r = Invoke-RestMethod -Uri "http://127.0.0.1:$env:BLAUBE_PORT/blaube/ping" -TimeoutSec 2
              if ($r.app -eq 'blaube') { $ok = $true; break }
            } catch {}
          }
          Get-Process -Name Blaube -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw 'The installed Blaube never answered on its port' }
          Write-Host "The installed Blaube started and answered in about $i s"
      # The installers, the zips the Mac updater downloads, and the update
      # feeds (latest*.yml) with their blockmaps.
      - uses: actions/upload-artifact@v4
        with:
          name: blaube-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  # A v* tag (npm run release), or running this workflow by hand on main,
  # publishes a real release. The app checks
  # GitHub's newest release for updates, and the README links download from
  # it with plain links, e.g.
  # https://github.com/syverlauritz/blaube/releases/latest/download/Blaube-mac-arm64.dmg
  release:
    needs: [package, life]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches package.json
        run: |
          v="v$(node -p 'require(`./package.json`).version')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$v" = "$GITHUB_REF_NAME"
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            # By hand: never publish over a version that's out already.
            if gh release view "$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "$v is out already"; exit 1; fi
            echo "TAG=$v" >> "$GITHUB_ENV"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${TAG#v}" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          cat notes.md
      - name: Publish the release
        run: |
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$TAG" artifacts/* -R "$GITHUB_REPOSITORY" --title "Blaube ${TAG#v}" --target "$GITHUB_SHA" "${notes[@]}"

  # Every push to main: a rolling "nightly" pre-release to try what's next.
  # (Pre-releases are never offered as updates.)
  nightly:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One at a time: two pushes close together would otherwise delete the
    # release under each other's uploads.
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Replace the nightly pre-release
        run: |
          # (latest: what this was called before real releases, whose
          # /releases/latest links it would muddle)
          for t in nightly latest; do
            gh release delete "$t" -R "$GITHUB_REPOSITORY" --cleanup-tag -y || true
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$t" || true
          done
          # A nightly run that failed halfway can leave a draft behind. (Only
          # nightly ones: a real release is a draft while its files upload,
          # and its run may be going right now, from the same push.)
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft and (.tag_name == "nightly" or .tag_name == "latest" or (.name // "" | startswith("Nightly")))) | .id' | xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/{}" || true
          gh release create nightly artifacts/*.dmg artifacts/*.exe -R "$GITHUB_REPOSITORY" --prerelease --target "$SHA" \
            --title "Nightly (${SHA::7})" \
            --notes "Built automatically from ${SHA}, not a release: things may be half done. Releases update themselves; this doesn't. macOS: Blaube-mac-arm64.dmg (Apple Silicon) or Blaube-mac-x64.dmg (Intel). Windows: Blaube-Setup-windows.exe."
