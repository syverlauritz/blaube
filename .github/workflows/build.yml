name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm test

  # The real app, invisible under a virtual screen, driven through fake hooks
  # (no Claude Code, no tokens): the slimes' physics and voice behaviour.
  life:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get install -y xvfb
      - run: BLAUBE_TEST=scripts/e2e/life.js BLAUBE_PORT=47872 xvfb-run -a npx electron --no-sandbox --disable-gpu-vsync --disable-frame-rate-limit .

  package:
    needs: test
    env:
      CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # One installer per CPU type, so each download carries a single copy of Electron.
      # With a Developer ID certificate in the repo secrets, the Mac build is
      # signed and notarized. Without one it is ad-hoc signed, which runs but
      # still needs "Open Anyway" in Privacy & Security on first launch.
      - if: runner.os == 'macOS' && env.CSC_LINK != ''
        run: npx electron-builder --mac --arm64 --x64 --publish never --config build/signed.config.js
      - if: runner.os == 'macOS' && env.CSC_LINK == ''
        run: npx electron-builder --mac --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - if: runner.os == 'Windows'
        run: |
          npx electron-builder --win --x64 --publish never
          npx electron-builder --win --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: blaube-${{ runner.os }}-arm64
          path: |
            dist/*-arm64.dmg
            dist/*-arm64.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: blaube-${{ runner.os }}-x64
          path: |
            dist/*-x64.dmg
            dist/*-x64.exe
          if-no-files-found: error

  # Publishes every build as a rolling "latest" pre-release, so installers
  # download with a plain link (no GitHub login), e.g.
  # https://github.com/syverlauritz/blaube/releases/download/latest/Blaube-mac-arm64.dmg
  release:
    needs: package
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Give the installers stable names
        run: |
          mkdir out
          cp artifacts/blaube-macOS-arm64/*.dmg out/Blaube-mac-arm64.dmg
          cp artifacts/blaube-macOS-x64/*.dmg out/Blaube-mac-x64.dmg
          cp artifacts/blaube-Windows-x64/*.exe out/Blaube-Setup-windows-x64.exe
          cp artifacts/blaube-Windows-arm64/*.exe out/Blaube-Setup-windows-arm64.exe
          ls -la out
      - name: Replace the latest pre-release
        run: |
          gh release delete latest -R "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          gh release create latest out/* -R "$GITHUB_REPOSITORY" --prerelease --target "$SHA" \
            --title "Latest build (${SHA::7})" \
            --notes "Built automatically from ${SHA}. macOS: Blaube-mac-arm64.dmg (Apple Silicon) or Blaube-mac-x64.dmg (Intel). Windows: Blaube-Setup-windows-x64.exe or -arm64.exe."
