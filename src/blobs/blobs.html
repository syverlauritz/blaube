<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>Blobs</title>
<style>
	@font-face { font-family: "Nunito"; src: url(../renderer/fonts/Nunito.woff2) format("woff2"); font-weight: 200 1000; }
	/* Every session and its blob, at a glance: a small flat bubble in the
	   talk box's style (docs/DESIGN.md): white, ink #1b2440, soft greys for
	   what you can touch, Nunito, round everything, no outlines or shadows.
	   Each row's eye is a little blob face in its colour: eyes open, it's
	   out on the screen; asleep, it's hidden. */
	:root {
		--paper: #fff; --ink: #1b2440; --dim: #5b6270; --faint: #8d94a1; --soft: #f1f2f6; --softer: #f7f8fa; --hover: #e7e9ef;
		--waitbg: #fde8ec; --waitfg: #b4233f; --asleep: #dfe2ea;
		--ui: "Nunito", system-ui, sans-serif;
	}
	/* Dark, as the talk box is when its moon is on. */
	body.dark {
		--paper: #1e2230; --ink: #eef0f7; --dim: #a6adbd; --faint: #7f8798; --soft: #2a2f3f; --softer: #252a38; --hover: #343a4c;
		--waitbg: #4a2530; --waitfg: #ff9fb3; --asleep: #3b4154;
		color-scheme: dark;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; background: transparent; font: 600 14px/1.4 var(--ui); color: var(--ink); overflow: hidden; user-select: none; }
	button, select { font-family: var(--ui); }
	[hidden] { display: none !important; }
	.card { margin: 8px; background: var(--paper); border-radius: 26px; display: flex; flex-direction: column; max-height: calc(100vh - 16px); overflow: hidden; }
	.card.pop { animation: pop .24s cubic-bezier(.3, 1.5, .5, 1); }
	@keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }

	header { display: flex; align-items: center; gap: 10px; padding: 16px 14px 8px 22px; -webkit-app-region: drag; }
	header .titles { flex: 1; min-width: 0; }
	h1 { margin: 0; font: 800 20px/1.2 var(--ui); }
	.sub { color: var(--dim); font: 600 13px/1.3 var(--ui); }
	.round { -webkit-app-region: no-drag; border: 0; background: var(--soft); color: var(--dim); width: 32px; height: 32px; border-radius: 50%; padding: 0; cursor: pointer; flex: none; display: grid; place-items: center; }
	.round:hover { background: var(--hover); color: var(--ink); }
	.round svg { width: 12px; height: 12px; }

	#rows { list-style: none; margin: 0; padding: 4px 10px; overflow-y: auto; flex: 1 1 auto; min-height: 0; scrollbar-width: thin; }
	#rows li { display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 12px; border-radius: 18px; }
	#rows li + li { margin-top: 2px; }
	#rows li:hover { background: var(--softer); }
	.dot { flex: none; width: 11px; height: 11px; border-radius: 50%; background: var(--c); }
	.who { flex: 1; min-width: 0; border: 0; background: none; padding: 0; text-align: left; color: inherit; cursor: pointer; }
	.who:disabled { cursor: default; }
	.who b { display: block; font: 800 15px/1.3 var(--ui); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.who:not(:disabled):hover b { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: var(--asleep); }
	.who small { display: block; font: 600 12.5px/1.3 var(--ui); color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.who small .wants { color: var(--waitfg); font-weight: 800; }
	li.off .who b { color: var(--faint); }
	li.off .dot { opacity: .45; }

	/* The eye: a little blob face, in its colour while it's out. */
	.eye { flex: none; width: 50px; height: 36px; border: 0; padding: 0; cursor: pointer; background: var(--c); border-radius: 50% 50% 44% 44% / 58% 58% 42% 42%; display: grid; place-items: center; transition: background .2s; }
	.eye svg { width: 30px; height: 16px; overflow: visible; }
	.eye .open { fill: #1b2440; }
	.eye .shut { fill: none; stroke: var(--faint); stroke-width: 2.2; stroke-linecap: round; display: none; }
	.eye[aria-pressed="false"] { background: var(--asleep); }
	.eye[aria-pressed="false"] .open { display: none; }
	.eye[aria-pressed="false"] .shut { display: inline; }
	.eye:hover { filter: brightness(1.04); }
	.eye.boing { animation: boing .32s cubic-bezier(.3, 1.6, .5, 1); }
	@keyframes boing { 30% { transform: scale(1.12, .84); } 65% { transform: scale(.96, 1.06); } }
	.empty { color: var(--dim); padding: 6px 12px 10px; }

	footer { padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
	.max { display: flex; align-items: center; gap: 10px; padding: 0 4px 0 6px; }
	.max label { flex: 1; font: 700 14px var(--ui); }
	select { border: 0; border-radius: 999px; background: var(--soft); color: var(--ink); font: 700 14px var(--ui); height: 32px; padding: 0 12px; cursor: pointer; }
	select:hover { background: var(--hover); }
	.hint { color: var(--dim); font: 600 12.5px/1.35 var(--ui); padding: 0 6px; }
	.note { background: var(--waitbg); color: var(--waitfg); border-radius: 16px; padding: 8px 12px; font: 700 13px/1.35 var(--ui); }
	.quick { display: flex; gap: 8px; }
	.tbtn { flex: 1; height: 34px; border: 0; border-radius: 999px; padding: 0 12px; background: var(--soft); color: var(--ink); font: 700 14px var(--ui); cursor: pointer; white-space: nowrap; }
	.tbtn:hover { background: var(--hover); }
	.tbtn:disabled { color: var(--faint); background: var(--softer); cursor: default; }
</style>
</head>
<body>
	<div class="card pop" id="card">
		<header>
			<div class="titles">
				<h1>Blobs</h1>
				<div class="sub" id="sub"></div>
			</div>
			<button class="round" id="close" type="button" title="Close (Esc)" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
		</header>
		<ul id="rows"></ul>
		<footer>
			<div class="max">
				<label for="max">Max blobs</label>
				<select id="max" title="At most this many blobs on the screen; the least busy ones over it are put away"></select>
			</div>
			<div class="hint" id="maxHint" hidden>Blobs that need you always show, even over the max.</div>
			<div class="note" id="note" hidden></div>
			<div class="quick">
				<button class="tbtn" id="showAll" type="button">Show all</button>
				<button class="tbtn" id="hideIdle" type="button" title="Hides the ones that are done or idle; their sessions carry on">Hide all idle</button>
			</div>
		</footer>
	</div>
	<script src="blobs.js"></script>
</body>
</html>
