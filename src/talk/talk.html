<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>Talk</title>
<style>
  @font-face { font-family: "Coiny"; src: url(../renderer/fonts/Coiny.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: "Concert One"; src: url(../renderer/fonts/ConcertOne.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: "DynaPuff"; src: url(../renderer/fonts/DynaPuff.woff2) format("woff2"); font-weight: 400 700; }
  @font-face { font-family: "Nunito"; src: url(../renderer/fonts/Nunito.woff2) format("woff2"); font-weight: 200 1000; }
  @font-face { font-family: "Rubik Spray Paint"; src: url(../renderer/fonts/RubikSprayPaint.woff2) format("woff2"); font-weight: 400; }
  /* The same flat white bubble as everything Blaube says (docs/DESIGN.md),
     kept as plain as the bubbles on the desktop: white, ink #1b2440, one
     soft grey for things you can touch or type in, and the slime's own
     colour only on the one thing to press. No outlines, no shadows. Its
     tail is drawn by the slime's layer (from under the bubble to the
     slime), since the bubble drifts after the slime in its own window. */
  :root {
    --ink: #1b2440; --dim: #5b6270; --faint: #9aa0ad; --soft: #f1f2f6; --on: #fff;
    --color: #d97757; --name: "Nunito", system-ui, sans-serif;
    /* Rounded letters, like everything else about a slime (Nunito, bundled). */
    --ui: "Nunito", system-ui, sans-serif;
    --ox: 50%; --oy: 100%;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; font: 600 16px/1.45 var(--ui); color: var(--ink); overflow: hidden; user-select: none; }
  .wrap { position: absolute; inset: 0; transform-origin: var(--ox) var(--oy); }
  .wrap.pop { animation: pop .26s cubic-bezier(.3, 1.5, .5, 1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .wrap.shut { animation: shut .17s cubic-bezier(.5, 0, .8, .4) forwards; }
  @keyframes shut { to { transform: scale(.7, .6); opacity: 0; } }
  .wrap.boing { animation: boing .34s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes boing { 35% { transform: scale(1.02, .975); } 70% { transform: scale(.995, 1.01); } }
  @keyframes squish { from { transform: scale(.8, .6); opacity: 0; } to { transform: none; opacity: 1; } }
  /* 12 px clear round the bubble, so its pop and wobble never get cut off. */
  .bubble { position: absolute; inset: 12px; display: flex; flex-direction: column; background: #fff; border-radius: 30px; overflow: hidden; }

  header { display: flex; align-items: center; gap: 8px; padding: 16px 14px 6px 22px; }
  /* Display fonts that come in one weight are drawn at it (a faked bold smudges). */
  .name.plain { font-family: var(--ui); --nameWeight: 800; }
  .name { font: var(--nameWeight, 700) 18px var(--name); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 0 1 auto; }
  /* The slime's face says how it is: no state words up here. */
  .state { display: none; }
  .spacer { flex: 1; min-width: 12px; }
  /* Close (and terminal): soft little pebbles, like the send button. */
  .round { border: 0; background: var(--soft); color: var(--dim); width: 30px; height: 30px; border-radius: 50%; padding: 0; cursor: pointer; flex: none; display: grid; place-items: center; }
  .round svg { width: 13px; height: 13px; }
  .round:hover { background: var(--soft); color: var(--ink); }
  /* Going to the terminal is there when you want it, not in the way. */
  #terminal { opacity: 0; transition: opacity .2s; position: absolute; right: 44px; top: 13px; }
  header:hover #terminal, #terminal:focus-visible { opacity: 1; }

  /* Stop: there while it works, out of the way otherwise. A soft pill with
     a little square, the one thing that looks like "stop" everywhere. */
  .stop { display: flex; align-items: center; gap: 6px; flex: none; border: 0; border-radius: 999px; padding: 5px 12px 5px 10px; background: var(--soft); color: var(--dim); font: 700 14px var(--ui); cursor: pointer; animation: squish .3s cubic-bezier(.3, 1.6, .5, 1); }
  .stop[hidden] { display: none; }
  .stop i { width: 9px; height: 9px; border-radius: 2.5px; background: currentColor; }
  .stop:hover { color: var(--ink); }
  .stop:disabled { cursor: default; color: var(--faint); }

  /* Its to-do list: one line (how far, what now), the whole list a tap away. */
  .todo { margin: 0 16px 4px; flex: none; }
  .todo[hidden] { display: none; }
  #todoHead { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: var(--soft); border-radius: 999px; padding: 7px 14px; font: 600 14px var(--ui); color: var(--dim); cursor: pointer; text-align: left; }
  #todoHead:hover { color: var(--ink); }
  .todo .bar { flex: none; width: 34px; height: 8px; border-radius: 4px; background: #e2e4eb; overflow: hidden; }
  .todo .bar i { display: block; height: 100%; border-radius: 4px; background: var(--color); transition: width .4s cubic-bezier(.3, 1.4, .5, 1); }
  #todoNow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  #todoCount { flex: none; }
  #todoList { list-style: none; margin: 6px 0 2px; padding: 0 6px; max-height: 180px; overflow-y: auto; font: 600 14px/1.5 var(--ui); color: var(--dim); }
  #todoList[hidden] { display: none; }
  #todoList li { padding-left: 22px; position: relative; overflow-wrap: anywhere; }
  #todoList li::before { content: ""; position: absolute; left: 4px; top: .45em; width: 9px; height: 9px; border-radius: 50%; background: #dfe2ea; }
  #todoList li.in_progress { color: var(--ink); }
  #todoList li.in_progress::before { background: var(--color); }
  #todoList li.completed { color: var(--faint); text-decoration: line-through; }
  #todoList li.completed::before { background: var(--color); opacity: .4; }

  /* The log takes what's left; a tall card scrolls instead of pushing the field out. */
  #log { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 4px 22px 10px; }
  #log.scrolled { -webkit-mask-image: linear-gradient(to bottom, transparent 0, transparent 4px, #000 18px); }
  #log.squeezed { display: none; }
  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px; }
  #log:hover::-webkit-scrollbar-thumb { background: #dfe2ea; }
  #inner { display: flex; flex-direction: column; gap: 10px; padding-top: 2px; }
  .empty { color: var(--dim); padding: 4px 0 2px; }
  /* The slime talks in plain text, like its bubbles; you get a soft pill. */
  .msg { overflow-wrap: anywhere; user-select: text; white-space: pre-wrap; }
  .msg.claude { align-self: stretch; }
  .msg.you { align-self: flex-end; max-width: 82%; background: var(--soft); padding: 9px 15px; border-radius: 22px; }
  .msg.you.queued, .msg.you.unsent { color: var(--dim); }
  .msg.new { animation: squish .3s cubic-bezier(.3, 1.6, .5, 1); }
  .msg.claude.new { transform-origin: 0 100%; }
  .msg.you.new { transform-origin: 100% 100%; }
  .msg code { font: 500 14px ui-monospace, Menlo, Consolas, monospace; background: var(--soft); border-radius: 5px; padding: 1px 4px; }
  .msg pre { margin: 4px 0; padding: 9px 12px; background: var(--soft); border-radius: 16px; font: 500 14px/1.4 ui-monospace, Menlo, Consolas, monospace; white-space: pre; overflow-x: auto; }
  .msg .head { font-weight: 700; }
  .msg.folded { max-height: 15.5em; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent); }
  .more { align-self: flex-start; border: 0; background: none; padding: 0; margin-top: -4px; font: 600 14px var(--ui); color: var(--dim); cursor: pointer; }
  .more:hover { color: var(--ink); }
  .meta { font: 600 14px var(--ui); color: var(--dim); margin: -6px 2px 0; align-self: flex-end; }
  .unsend { border: 0; background: none; padding: 0; font: inherit; color: var(--dim); cursor: pointer; }
  .unsend:hover { color: var(--ink); }
  .note { align-self: center; font: 600 14px var(--ui); color: var(--dim); text-align: center; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* What it did between replies: small and quiet, a line per step; a long
     run shows its last few, with the rest a tap away. */
  .steps { display: flex; flex-direction: column; gap: 1px; margin: -2px 0; }
  .step { font: 600 14px/1.35 var(--ui); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: text; padding-left: 20px; position: relative; }
  .step::before { content: ""; position: absolute; left: 4px; top: .5em; width: 7px; height: 7px; border-radius: 50%; background: var(--color); opacity: .55; }
  .step.failed { color: #c0392b; }
  .step.failed::before { background: #e05a4f; opacity: 1; }
  .step.new { animation: squish .3s cubic-bezier(.3, 1.6, .5, 1); transform-origin: 0 50%; }
  button.step { border: 0; background: none; margin: 0; padding: 0 0 0 20px; text-align: left; cursor: pointer; }
  button.step:hover { color: var(--ink); }
  button.step::after { content: "›"; display: inline-block; margin-left: 6px; color: var(--faint); transition: transform .15s; }
  button.step.open::after { transform: rotate(90deg); }
  button.step.failed:hover { color: #a93226; }
  .stepout { margin: 3px 0 6px 20px; padding: 8px 12px; background: var(--soft); border-radius: 14px; font: 500 14px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow-y: auto; user-select: text; animation: squish .25s cubic-bezier(.3, 1.6, .5, 1); transform-origin: 0 0; }
  .stepout[hidden] { display: none; }
  .steps:not(.open) .step.early, .steps:not(.open) .step.early + .stepout { display: none; }
  .steps .earlier { align-self: flex-start; border: 0; background: none; padding: 0 0 1px 20px; font: 600 14px var(--ui); color: var(--faint); cursor: pointer; }
  .steps .earlier:hover { color: var(--ink); }
  .dots { align-self: flex-start; display: flex; gap: 5px; padding: 6px 0; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--color); animation: bob 1.1s ease-in-out infinite; transform-origin: 50% 100%; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  /* Each dot hops like a tiny slime: squashed on landing, stretched in the air. */
  @keyframes bob { 0%, 68%, 100% { transform: none; } 12% { transform: scale(1.15, .85); } 35% { transform: translateY(-5px) scale(.9, 1.1); } 55% { transform: scale(1.25, .75); } }

  .hint { margin: 0 22px 8px; color: var(--dim); font: 600 14px/1.4 var(--ui); text-align: center; text-wrap: balance; }
  .hint:empty { display: none; }

  /* A question for you (permission, a choice, a plan): no box of its own,
     just room, the question, and the choices. */
  .ask { margin: 2px 22px 14px; flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .ask[hidden] { display: none; }
  .ask.new { animation: squish .3s cubic-bezier(.3, 1.6, .5, 1); transform-origin: 50% 100%; }
  .ask .what { display: flex; gap: 6px; align-items: baseline; margin-bottom: 8px; }
  .ask .what b { font-weight: 700; }
  .ask .what span { font: 600 14px var(--ui); color: var(--dim); }
  .ask[data-kind="question"] .what b { font: 600 14px var(--ui); color: var(--dim); }
  #askDetail { display: block; font: 500 14px/1.4 ui-monospace, Menlo, Consolas, monospace; background: var(--soft); border-radius: 16px; padding: 9px 13px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 78px; overflow-y: auto; user-select: text; }
  #askDetail[hidden] { display: none; }
  #askQuestions, .ask .plan { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
  #askQuestions::-webkit-scrollbar { width: 0; } /* the fade says there's more */
  .ask .plan::-webkit-scrollbar, #askDetail::-webkit-scrollbar { width: 6px; }
  .ask .plan::-webkit-scrollbar-thumb, #askDetail::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px; }
  .ask .plan:hover::-webkit-scrollbar-thumb, #askDetail:hover::-webkit-scrollbar-thumb { background: #dfe2ea; }
  #askQuestions.overflowing, .ask .plan.overflowing { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent); }
  .ask .plan { max-width: none; background: var(--soft); border-radius: 18px; padding: 11px 14px; user-select: text; }
  .ask .plan[hidden] { display: none; }
  .q + .q { margin-top: 14px; }
  .q .text { font-weight: 700; margin: 0 0 8px; }
  .q .text span { font: 600 14px var(--ui); color: var(--dim); }
  .opts { display: flex; flex-direction: column; gap: 6px; }
  .opts.chips { flex-direction: row; flex-wrap: wrap; }
  .opt { text-align: left; border: 0; border-radius: 20px; padding: 10px 16px; background: var(--soft); color: var(--ink); font: 700 16px/1.3 var(--ui); cursor: pointer; transition: background .12s, transform .12s; }
  .chips .opt { border-radius: 999px; padding: 7px 14px; }
  .opt small { display: block; font: 600 14px/1.3 var(--ui); color: var(--dim); margin-top: 1px; }
  .opt:hover { background: #e8eaf0; }
  .opt:active { transform: scale(.98); }
  .opt.on { background: var(--color); color: var(--on); }
  .opt.on small { color: inherit; opacity: .8; }
  .opt.picked { animation: squish .3s cubic-bezier(.3, 1.6, .5, 1); }
  .opt:disabled { opacity: .5; cursor: default; }
  .opt:focus-visible { outline: 2px solid var(--color); outline-offset: 1px; }
  /* Every text button looks the same: dim, 600, ink on hover. */
  .otherchip { margin-top: 4px; border: 0; background: none; padding: 4px 0; font: 600 14px var(--ui); color: var(--dim); cursor: pointer; text-align: left; }
  .otherchip:hover { color: var(--ink); }
  .otherchip[hidden], .other[hidden] { display: none; }
  .other { width: 100%; margin-top: 6px; border: 0; border-radius: 999px; padding: 9px 16px; font: 600 16px var(--ui); color: var(--ink); background: var(--soft); outline: none; user-select: text; }
  .other::placeholder { color: var(--faint); }
  .asknote { font: 600 14px var(--ui); color: var(--dim); margin-top: 8px; }
  .asknote:empty { display: none; }
  .ask .row { display: flex; gap: 8px; margin-top: 10px; }
  .ask .row[hidden] { display: none; }
  .ask .row button { flex: 1; border: 0; border-radius: 999px; padding: 11px 0; font: 700 15px var(--ui); cursor: pointer; background: var(--soft); color: var(--ink); }
  .ask .row button.allow { background: var(--color); color: var(--on); }
  .ask .row button:hover { filter: brightness(0.97); }
  .ask button:disabled { opacity: .5; cursor: default; }
  .ask .row button.allow:disabled { opacity: 1; background: var(--soft); color: var(--faint); }
  .ask .always { display: block; margin: 8px auto 0; border: 0; background: none; padding: 4px 0; font: 600 14px var(--ui); color: var(--dim); cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ask .always:hover { color: var(--ink); }
  .ask .always[hidden] { display: none; }
  /* Several questions: the card is the whole conversation for now. */
  body.carding form { display: none; }
  body.carding .ask { margin-bottom: 16px; }

  form { display: flex; gap: 8px; align-items: flex-end; padding: 2px 16px 16px; }
  textarea { flex: 1; resize: none; border: 0; border-radius: 22px; padding: 10px 16px; font: 600 16px/1.4 var(--ui); color: var(--ink); background: var(--soft); max-height: 104px; outline: none; overflow-y: hidden; user-select: text; }
  textarea::placeholder { color: var(--faint); }
  textarea:disabled { opacity: .6; }
  form button { flex: none; width: 42px; height: 42px; border: 0; border-radius: 50%; background: var(--color); color: var(--on); cursor: pointer; display: grid; place-items: center; transition: background .15s, color .15s, transform .15s; }
  form button svg { width: 18px; height: 18px; }
  form button:disabled { background: var(--soft); color: var(--faint); cursor: default; }
  form button:not(:disabled):active { transform: scale(.88); }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="bubble">
    <header>
      <span class="name" id="name"></span>
      <span class="state"><i id="dot"></i><span id="state"></span></span>
      <button class="stop" id="stop" hidden title="It stops before its next step"><i></i><span>Stop</span></button>
      <span class="spacer"></span>
      <button class="round" id="terminal" title="Go to its terminal (or Alt-click the slime)" aria-label="Go to its terminal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7l5 5-5 5M12 17h7"/></svg></button>
      <button class="round" id="close" title="Close (Esc)" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
    </header>
    <div class="todo" id="todo" hidden>
      <button id="todoHead"><span class="bar"><i id="todoFill"></i></span><span id="todoNow"></span><span id="todoCount"></span></button>
      <ul id="todoList" hidden></ul>
    </div>
    <div id="log"><div id="inner"></div></div>
    <div class="ask" id="ask" hidden>
      <div class="what"><b id="askWhat"></b><span id="askMore"></span></div>
      <code id="askDetail"></code>
      <div id="askQuestions"></div>
      <div class="plan msg" id="askPlan" hidden></div>
      <div class="asknote" id="askNote"></div>
      <div class="row" id="askRow">
        <button id="deny">Deny</button>
        <button id="allow" class="allow">Allow</button>
      </div>
      <button class="always" id="always" title="Allow this, and don’t ask again"></button>
    </div>
    <div class="hint" id="hint"></div>
    <form id="form">
      <textarea id="text" rows="1" placeholder="Say something…"></textarea>
      <button id="send" type="submit" disabled aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg></button>
    </form>
  </div>
</div>
<script src="talk.js"></script>
</body>
</html>
