<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Talk</title>
<style>
  :root {
    --bg: #fbf8f4; --ink: #24211e; --muted: #8a8178; --line: #e8e1d8;
    --you: #d97757; --you-ink: #fff; --claude: #f0ebe4; --field: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #26231f; --ink: #f1ece6; --muted: #a29a90; --line: #3a3530; --claude: #332f2a; --field: #1e1c19; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); }
  .card { position: absolute; inset: 6px; display: flex; flex-direction: column; background: var(--bg); border-radius: 16px; border: 1px solid var(--line); overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 10px 8px 14px; border-bottom: 1px solid var(--line); -webkit-app-region: drag; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .state::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: var(--dot, #9a9a9a); vertical-align: 1px; }
  .spacer { flex: 1; }
  header button { -webkit-app-region: no-drag; border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px; padding: 3px 7px; border-radius: 6px; cursor: pointer; white-space: nowrap; flex: none; }
  header button:hover { background: var(--claude); color: var(--ink); }
  #log { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .empty { margin: auto; color: var(--muted); text-align: center; padding: 0 20px; }
  .msg { max-width: 85%; padding: 7px 10px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.claude { align-self: flex-start; background: var(--claude); border-bottom-left-radius: 4px; }
  .msg.you { align-self: flex-end; background: var(--you); color: var(--you-ink); border-bottom-right-radius: 4px; }
  .meta { font-size: 10.5px; color: var(--muted); margin-top: -3px; }
  .meta.you { align-self: flex-end; }
  .note { margin: 0 12px 8px; padding: 6px 9px; border-radius: 8px; background: var(--claude); color: var(--muted); font-size: 11.5px; }
  .note:empty { display: none; }
  form { display: flex; gap: 6px; padding: 0 10px 10px; }
  textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font: inherit; color: var(--ink); background: var(--field); max-height: 96px; outline: none; overflow-y: hidden; }
  textarea:focus { border-color: var(--you); }
  form button { border: 0; border-radius: 10px; background: var(--you); color: #fff; font: inherit; font-weight: 600; padding: 0 12px; cursor: pointer; }
  form button:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
<div class="card">
  <header>
    <span class="name" id="name"></span>
    <span class="state" id="state"></span>
    <span class="spacer"></span>
    <button id="terminal" title="Go to its terminal (or Alt-click the slime)">Terminal ↗</button>
    <button id="close" title="Close (Esc)">✕</button>
  </header>
  <div id="log"></div>
  <div class="note" id="note"></div>
  <form id="form">
    <textarea id="text" rows="1" placeholder="Say something…"></textarea>
    <button id="send" type="submit" disabled>Send</button>
  </form>
</div>
<script src="talk.js"></script>
</body>
</html>
