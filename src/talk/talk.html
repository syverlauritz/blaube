<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
<title>Talk</title>
<style>
  @font-face { font-family: "Nunito"; src: url(../renderer/fonts/Nunito.woff2) format("woff2"); font-weight: 200 1000; }
  /* A chat with a session, laid out like a proper chat: who it is and how
     it is at the top (with its project's git, to-do list and background
     tasks in a quiet panel under that), the conversation in the middle at
     a size you can read, and a roomy field with Send and Stop at the
     bottom. Still the flat white bubble of docs/DESIGN.md: white, ink
     #1b2440, soft greys for things you can touch, and the slime's own
     colour only on the one thing to press. No outlines, no shadows. Its
     tail is drawn by the slime's layer (from under the bubble to the
     slime, wherever it is), since the bubble stays put in its own window. */
  :root {
    --ink: #1b2440; --body: #2a3247; --dim: #5b6270; --faint: #8d94a1; --soft: #f1f2f6; --softer: #f7f8fa; --hover: #e7e9ef; --on: #fff;
    --red: #c0392b;
    /* (Surfaces and the rest, swapped for dark mode below.) */
    --paper: #fff; --line: #dfe2ea; --grip: #c9cdd6; --underline: #d5d8e0; --errbg: #fdecea; --offbtn: #e3e5eb; --inkhover: #2d3654;
    --drop: #fffaf7; --glass: rgba(255, 255, 255, .6); --glass2: rgba(255, 255, 255, .85); --green: #1e7e34; --waitbg: #fde8ec; --waitfg: #b4233f;
    --violet: #8a5cd0; --teal: #2f8f83; --tint: 11%;
    --color: #d97757;
    /* Rounded letters, like everything else about a slime (Nunito, bundled). */
    --ui: "Nunito", system-ui, sans-serif;
    --mono: ui-monospace, Menlo, Consolas, monospace;
    --ox: 50%; --oy: 100%;
    /* The column everything lines up on. */
    --side: 26px;
  }
  /* Dark mode (the moon in its header; kept for every box): the same flat
     bubble in a deep slate, light ink, quieter greys. No tail. */
  body.dark {
    --paper: #1e2230; --ink: #eef0f7; --body: #d9dde8; --dim: #a6adbd; --faint: #7f8798; --soft: #2a2f3f; --softer: #252a38; --hover: #343a4c;
    --red: #ff8b7e; --line: #3b4154; --grip: #4a5167; --underline: #4f566c; --errbg: #3d2528; --offbtn: #303648; --inkhover: #cfd4e2;
    --drop: #262433; --glass: rgba(255, 255, 255, .08); --glass2: rgba(255, 255, 255, .85); --green: #72d08c; --waitbg: #4a2530; --waitfg: #ff9fb3;
    --violet: #b996f2; --teal: #63c7ba; --tint: 20%;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; font: 600 15px/1.45 var(--ui); color: var(--ink); overflow: hidden; user-select: none; }
  button { font-family: var(--ui); }
  .wrap { position: absolute; inset: 0; transform-origin: var(--ox) var(--oy); }
  .wrap.pop { animation: pop .26s cubic-bezier(.3, 1.5, .5, 1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .wrap.shut { animation: shut .17s cubic-bezier(.5, 0, .8, .4) forwards; }
  @keyframes shut { to { transform: scale(.7, .6); opacity: 0; } }
  .wrap.boing { animation: boing .34s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes boing { 35% { transform: scale(1.01, .99); } 70% { transform: scale(.998, 1.004); } }
  @keyframes squish { from { transform: scale(.8, .6); opacity: 0; } to { transform: none; opacity: 1; } }
  /* 12 px clear round the bubble, so its pop and wobble never get cut off. */
  .bubble { position: absolute; inset: 12px; display: flex; flex-direction: column; background: var(--paper); border-radius: 30px; overflow: hidden; }
  .bubble > * { flex: none; }
  /* Its edges and corners resize it: invisible strips over the clear margin
     and the bubble's very edge, the bottom right corner with a few faint
     dots to say so. */
  .grips i { position: fixed; z-index: 60; }
  .grips [data-edge="n"] { top: 0; left: 28px; right: 28px; height: 17px; cursor: ns-resize; }
  .grips [data-edge="s"] { bottom: 0; left: 28px; right: 28px; height: 17px; cursor: ns-resize; }
  .grips [data-edge="e"] { right: 0; top: 28px; bottom: 28px; width: 17px; cursor: ew-resize; }
  .grips [data-edge="w"] { left: 0; top: 28px; bottom: 28px; width: 17px; cursor: ew-resize; }
  .grips [data-edge="nw"], .grips [data-edge="ne"], .grips [data-edge="sw"], .grips [data-edge="se"] { width: 28px; height: 28px; }
  .grips [data-edge="nw"] { top: 0; left: 0; cursor: nwse-resize; }
  .grips [data-edge="se"] { bottom: 0; right: 0; cursor: nwse-resize; }
  .grips [data-edge="ne"] { top: 0; right: 0; cursor: nesw-resize; }
  .grips [data-edge="sw"] { bottom: 0; left: 0; cursor: nesw-resize; }
  .grips svg { position: absolute; right: 21px; bottom: 21px; width: 9px; height: 9px; fill: var(--grip); opacity: .7; transition: opacity .15s; }
  .grips [data-edge="se"]:hover svg, body.resizing .grips svg { opacity: 1; fill: var(--faint); }
  [hidden] { display: none !important; }

  /* ---- Top: who it is, how it is, and the way to the others ---- */
  header { padding: 16px 16px 10px var(--side); }
  /* Its header moves it (drag it anywhere); what's in it still takes clicks. */
  header { cursor: grab; }
  body.moving, body.moving header { cursor: grabbing; }
  /* Pinned, it stays open: the pin is lit. */
  .round#pin svg { width: 15px; height: 15px; }
  .round#pin.on { background: var(--ink); color: var(--paper); }
  .round#theme svg { width: 15px; height: 15px; }
  .round#theme .sun, body.dark .round#theme .moon { display: none; }
  body.dark .round#theme .sun { display: block; }
  .titlebar, .statusbar { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .statusbar { margin-top: 6px; gap: 10px; }
  .spacer { flex: 1; min-width: 8px; }
  /* Display fonts that come in one weight are drawn at it (a faked bold smudges). */
  /* The talk box is for reading: its name is in the same Nunito as the rest, just heavier. */
  .name { font: 800 21px/1.25 var(--ui); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 0 1 auto; }
  /* Its name, if it has one (Claude's title or yours, from /rename). */
  .subname { font: 600 14px/1.3 var(--ui); color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; cursor: text; }
  /* How it is right now, in words: Working, Needs you, Done, Idle, Ended. */
  .state { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 3px 11px 3px 9px; border-radius: 999px; background: var(--soft); font: 700 13px/1.3 var(--ui); color: var(--dim); white-space: nowrap; }
  .state i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .state.working { color: var(--ink); }
  .state.working i { animation: breathe 1.4s steps(6) infinite; } /* (in steps: see .dots i) */
  @keyframes breathe { 50% { transform: scale(.6); } }
  .state.waiting { background: var(--waitbg); color: var(--waitfg); }
  /* Buttons with words on them: All sessions, Terminal. */
  .tbtn { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 32px; border: 0; border-radius: 999px; padding: 0 13px; background: var(--soft); color: var(--ink); font: 700 14px var(--ui); cursor: pointer; white-space: nowrap; }
  .tbtn:hover { background: var(--hover); }
  .tbtn svg { width: 15px; height: 15px; flex: none; }
  .tbtn .count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--paper); color: var(--dim); font: 800 12px/20px var(--ui); text-align: center; }
  .tbtn .count.wants { background: #ff4d6d; color: #fff; }
  body.overview #allSessions { background: var(--color); color: var(--on); }
  body.overview #allSessions .count { background: var(--glass2); color: var(--ink); }
  .round { border: 0; background: var(--soft); color: var(--dim); width: 32px; height: 32px; border-radius: 50%; padding: 0; cursor: pointer; flex: none; display: grid; place-items: center; }
  .round svg { width: 13px; height: 13px; }
  .round:hover { background: var(--hover); color: var(--ink); }

  /* Every session as a tab with its colour and name, to hop between them;
     the one you're talking to is lit in its colour, one that needs you
     says so. */
  .others { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
  .others:empty { display: none; }
  .others::-webkit-scrollbar { display: none; }
  .others button { flex: none; display: inline-flex; align-items: center; gap: 7px; max-width: 190px; height: 30px; border: 0; border-radius: 999px; padding: 0 12px 0 10px; background: var(--softer); color: var(--dim); font: 700 13.5px var(--ui); cursor: pointer; white-space: nowrap; }
  .others button::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .others button span { overflow: hidden; text-overflow: ellipsis; }
  .others button:hover { background: var(--soft); color: var(--ink); }
  .others button.here { background: color-mix(in srgb, var(--c) 16%, var(--paper)); color: var(--ink); cursor: default; }
  .others button small { font: 800 12px var(--ui); color: var(--red); }
  .others button:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }

  /* ---- Under the top: its project, quietly, a tap away ---- */
  /* (git, its to-do list, what runs in the background, tools that need
     you). Each row has a word in front saying what it is; the panel
     scrolls on its own so it never squeezes the conversation out. */
  .side { margin: 0 14px 6px; padding: 6px 12px; border-radius: 20px; background: var(--softer); max-height: 40%; overflow-y: auto; flex: 0 1 auto; min-height: 46px; display: flex; flex-direction: column; gap: 2px; }
  .side:not(:has(> :not([hidden]))) { display: none; }
  .side::-webkit-scrollbar { width: 6px; }
  .side::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px; }
  .side:hover::-webkit-scrollbar-thumb { background: var(--line); }
  .side .label, .git::before, #todoHead::before { flex: none; width: 74px; font: 800 12px/1.2 var(--ui); color: var(--faint); text-transform: uppercase; letter-spacing: .04em; }
  .git { display: flex; align-items: center; width: 100%; min-height: 34px; border: 0; border-radius: 12px; background: none; padding: 4px 8px; font: 600 14px var(--ui); color: var(--ink); text-align: left; cursor: default; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .git::before { content: "Git"; }
  button.git.opens { cursor: pointer; }
  button.git.opens::after { content: "Show"; margin-left: auto; padding-left: 12px; font: 700 13px var(--ui); color: var(--dim); }
  button.git.opens[aria-expanded="true"]::after { content: "Hide"; }
  button.git.opens:hover { background: var(--soft); }
  .gitfiles { margin: 0 0 6px 82px; padding: 0; list-style: none; max-height: 220px; overflow-y: auto; }
  .gitfiles button { display: flex; gap: 8px; width: 100%; border: 0; background: none; padding: 3px 0; font: 600 14px var(--ui); color: var(--body); text-align: left; cursor: pointer; }
  .gitfiles button:hover { color: var(--ink); }
  .gitfiles button span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gitfiles button small { flex: none; font: 600 13px var(--ui); color: var(--faint); }
  .gitfiles .conflict small { color: var(--red); }
  .gitfiles li { display: flex; flex-wrap: wrap; align-items: center; }
  .gitfiles li > button:first-child { flex: 1; min-width: 0; width: auto; }
  .gitfiles .reveal { flex: none; width: auto; margin-left: 4px; padding: 2px 9px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--dim); }
  .gitfiles .reveal:hover { background: var(--soft); color: var(--ink); }
  .gitfiles .reveal.sure { background: #d04a3c; color: #fff; }
  .gitfiles .putback { display: flex; align-items: center; gap: 8px; color: var(--dim); }
  .gitfiles .putback span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gitfiles .putback button { flex: none; width: auto; padding: 3px 10px; border-radius: 999px; background: var(--ink); color: var(--paper); }
  .gitfiles .putback button:hover { color: var(--paper); opacity: .85; }
  .gitfiles .diff { flex-basis: 100%; margin: 3px 0 6px; font-size: 13px; max-height: 220px; }
  .diff .add, #askDetail .add { color: var(--green); }
  .diff .del, #askDetail .del { color: var(--red); }
  .diff .hunk { color: var(--faint); }
  .branches { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 2px 0 8px 82px; }
  .branches .branchon { font: 800 12px var(--ui); color: var(--faint); text-transform: uppercase; letter-spacing: .04em; margin-right: 2px; }
  .branches > button { border: 0; border-radius: 999px; padding: 3px 11px; background: var(--paper); color: var(--ink); font: 600 13.5px var(--ui); cursor: pointer; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .branches > button:hover { background: var(--hover); }
  .branches > button.on { background: var(--ink); color: var(--paper); opacity: 1; cursor: default; }
  .branches > button.parked::after { content: ' •'; color: #d97757; }
  .branches > button.dim { background: none; color: var(--dim); }
  .branches > button:disabled:not(.on) { opacity: .5; cursor: default; }
  .branches .cloneform { width: auto; flex: 1; min-width: 220px; }
  .branches .cloneform input { padding: 4px 12px; font-size: 14px; background: var(--paper); }
  .branches .cloneform button { border: 0; border-radius: 999px; padding: 3px 12px; background: var(--ink); color: var(--paper); font: 700 13.5px var(--ui); cursor: pointer; }
  .branches .clonesaid:empty { display: none; }
  .branches > button.prlink { flex-basis: 100%; max-width: none; background: none; padding: 0 0 4px; text-align: left; color: var(--ink); font-weight: 700; }
  .branches > button.prlink:hover { text-decoration: underline; }
  .branches > button.prlink.web { color: var(--dim); font-weight: 600; }
  .branches .runrow { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; }
  .branches .runrow button { border: 0; border-radius: 999px; padding: 3px 11px; background: var(--paper); color: var(--ink); font: 600 13.5px var(--ui); cursor: pointer; }
  .branches .runrow button:hover { background: var(--hover); }
  .branches > button.onbranch { flex-basis: 100%; max-width: none; background: none; padding: 4px 0 0; text-align: left; color: var(--dim); font-size: 13.5px; }
  .branches > button.onbranch:hover { color: var(--ink); }
  .branches .behindrow { flex-basis: 100%; display: flex; align-items: center; gap: 8px; padding-top: 4px; font-size: 13.5px; color: var(--dim); }
  .branches .behindrow span { flex: 1; min-width: 0; }
  .branches .behindrow button { flex: none; border: 0; border-radius: 999px; padding: 3px 11px; background: var(--ink); color: var(--paper); font: 700 13px var(--ui); cursor: pointer; }
  .branches .behindrow button:disabled { opacity: .45; cursor: default; }
  .branches .behindrow.merged button, .branches .behindrow.stashed button { background: var(--paper); color: var(--ink); }
  .branches .behindrow.stashed span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .branches .behindrow button.sure { background: #d04a3c; color: #fff; }
  .branches .commits { flex-basis: 100%; margin: 4px 0 0; max-height: 220px; }
  /* What it left running in the background (a dev server, a watcher), and
     its tools that couldn't connect. */
  .bg { margin: 0; padding: 0; list-style: none; }
  .bg li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 34px; padding: 2px 8px; font: 600 14px var(--ui); color: var(--ink); }
  .bg li::before { content: "Running"; flex: none; width: 74px; font: 800 12px/1.2 var(--ui); color: var(--faint); text-transform: uppercase; letter-spacing: .04em; }
  .mcp li::before { content: "Tools"; color: var(--red); }
  .bg li span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bg button { border: 0; border-radius: 999px; padding: 3px 11px; background: var(--paper); font: 700 13px var(--ui); color: var(--ink); cursor: pointer; }
  .bg button:hover { background: var(--hover); }
  .bg button:disabled { opacity: .5; cursor: default; }
  .bg .bgout { flex: 1 0 100%; margin: 4px 0 6px 80px; padding: 9px 12px; background: var(--paper); border-radius: 14px; font: 500 13px/1.45 var(--mono); color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow-y: auto; user-select: text; }
  .bg .bgout.failed { color: var(--red); }
  /* Its to-do list: one line (how far, what now), the whole list a tap away. */
  .todo { flex: none; }
  #todoHead { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 34px; border: 0; background: none; border-radius: 12px; padding: 4px 8px; font: 600 14px var(--ui); color: var(--dim); cursor: pointer; text-align: left; }
  #todoHead::before { content: "To-do"; margin-right: -10px; }
  #todoHead:hover { background: var(--soft); }
  .todo .bar { flex: none; width: 44px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .todo .bar i { display: block; height: 100%; border-radius: 4px; background: var(--color); transition: width .4s cubic-bezier(.3, 1.4, .5, 1); }
  #todoNow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  #todoCount { flex: none; font-weight: 700; }
  #todoList { list-style: none; margin: 2px 0 6px 82px; padding: 0; max-height: 200px; overflow-y: auto; font: 600 14px/1.55 var(--ui); color: var(--dim); }
  #todoList li { padding-left: 22px; position: relative; overflow-wrap: anywhere; }
  #todoList li::before { content: ""; position: absolute; left: 3px; top: .45em; width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  #todoList li.in_progress { color: var(--ink); }
  #todoList li.in_progress::before { background: var(--color); }
  #todoList li.completed { color: var(--faint); text-decoration: line-through; }
  #todoList li.completed::before { background: var(--color); opacity: .4; }

  /* Find (Ctrl/⌘+F): a field over the log; what doesn't match steps aside. */
  .findbar { display: flex; align-items: center; gap: 10px; margin: 0 16px 8px; }
  .findbar input { flex: 1; min-width: 0; border: 0; border-radius: 999px; padding: 8px 16px; background: var(--soft); font: 600 15px var(--ui); color: var(--ink); outline: none; user-select: text; }
  .findbar input::placeholder { color: var(--faint); }
  #findCount { flex: none; font: 600 14px var(--ui); color: var(--dim); }
  body.searching #inner .miss, body.searching #inner .meta, body.searching #inner .more, body.searching .steps .earlier { display: none !important; }
  body.searching .steps .step.early { display: flex; }
  body.searching .stepout:not(.miss) { display: block; animation: none; }
  /* A word about what just happened (saved, copied); tap to see the file. */
  .toast { margin: 0 16px 8px; padding: 7px 14px; border: 0; border-radius: 999px; background: var(--soft); font: 600 14px var(--ui); color: var(--ink); text-align: left; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- The conversation ---- */
  /* The log takes what's left; a tall card scrolls instead of pushing the field out. */
  #log { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 6px var(--side) 14px; display: flex; flex-direction: column; }
  /* (A short chat sits down by the field, as in any chat.) */
  #inner { margin-top: auto; }
  #log.scrolled { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22px); }
  /* (Too little room for even a line: hidden, but still laid out, so it knows how much room to ask for.) */
  #log.squeezed { visibility: hidden; }
  #log::-webkit-scrollbar, .glance::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb, .glance::-webkit-scrollbar-thumb { background: transparent; border-radius: 4px; }
  #log:hover::-webkit-scrollbar-thumb, .glance:hover::-webkit-scrollbar-thumb { background: var(--line); }
  #inner { display: flex; flex-direction: column; gap: 14px; padding-top: 2px; }
  .empty { color: var(--dim); font: 600 17px/1.55 var(--ui); padding: 6px 0 2px; text-align: center; text-wrap: balance; }
  /* (Nothing said yet: the greeting sits in the middle.) */
  #inner:has(> .empty:only-child) { margin-block: auto; }
  /* Claude's replies: plain text across the column, at a reading size;
     yours: a soft bubble on the right. */
  .msg { overflow-wrap: anywhere; user-select: text; font: 500 16px/1.6 var(--ui); color: var(--body); }
  .msg.claude { align-self: stretch; position: relative; }
  .msg.you { align-self: flex-end; max-width: 85%; background: var(--soft); padding: 10px 16px; border-radius: 20px 20px 6px 20px; color: var(--ink); }
  .msg.you.queued, .msg.you.unsent { color: var(--dim); background: var(--softer); }
  .msg.new { animation: squish .3s cubic-bezier(.3, 1.6, .5, 1); }
  .msg.claude.new { transform-origin: 0 100%; }
  .msg.you.new { transform-origin: 100% 100%; }
  /* Markdown, as blocks: paragraphs, headings, lists, quotes, tables, code. */
  .msg > p, .msg li, .aside p { margin: 0; white-space: pre-wrap; }
  .msg > * + * { margin-top: .65em; }
  .msg h3, .msg h4, .msg h5 { margin: 0; font: 800 17px/1.4 var(--ui); color: var(--ink); }
  .msg h4, .msg h5 { font-size: 16px; }
  .msg > * + h3, .msg > * + h4, .msg > * + h5 { margin-top: 1em; }
  .msg ul, .msg ol { margin: 0; padding-left: 1.5em; }
  .msg li + li { margin-top: .2em; }
  .msg li::marker { color: var(--faint); font-weight: 700; }
  .msg ul ul, .msg ol ul, .msg ul ol, .msg ol ol { margin-top: .2em; }
  .msg blockquote { margin: 0; padding: 8px 14px; border-radius: 14px; background: var(--softer); color: var(--dim); white-space: pre-wrap; }
  .msg hr { border: 0; height: 2px; border-radius: 1px; background: var(--soft); margin: 1em 0; }
  .msg b, .msg strong { font-weight: 800; color: var(--ink); }
  .msg em { font-style: italic; }
  .msg .tablebox { overflow-x: auto; border-radius: 14px; background: var(--softer); }
  .msg table { border-collapse: collapse; font-size: 14.5px; line-height: 1.45; min-width: 100%; }
  .msg th, .msg td { padding: 6px 12px; text-align: left; vertical-align: top; white-space: pre-wrap; }
  .msg th { font-weight: 800; color: var(--ink); }
  .msg tr + tr td { background: linear-gradient(var(--soft), var(--soft)) top / 100% 2px no-repeat; }
  .msg code { font: 500 .88em var(--mono); background: var(--soft); border-radius: 6px; padding: 1px 5px; }
  .msg.you code { background: var(--paper); }
  .msg .filelink { cursor: pointer; box-shadow: inset 0 -1.5px 0 var(--faint); }
  .msg .filelink:hover { box-shadow: inset 0 -1.5px 0 var(--color); }
  .msg .code { position: relative; }
  .msg pre { margin: 0; padding: 12px 16px; background: var(--softer); border-radius: 16px; font: 500 14px/1.5 var(--mono); color: var(--ink); white-space: pre; overflow-x: auto; }
  .msg pre::-webkit-scrollbar { height: 8px; }
  .msg pre::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .link { color: inherit; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--color) 70%, transparent); text-underline-offset: 2px; cursor: pointer; word-break: break-all; }
  .link:hover { text-decoration-color: var(--color); }
  /* A file from a reply, opened in the box. */
  .peek { margin-top: 8px; white-space: normal; background: var(--softer); border-radius: 16px; overflow: hidden; animation: squish .25s cubic-bezier(.3, 1.6, .5, 1); transform-origin: 0 0; }
  .peekhead { display: flex; align-items: center; gap: 4px; padding: 8px 8px 0 14px; font: 700 14px var(--ui); color: var(--dim); }
  .peekhead span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .peekhead button { border: 0; background: none; border-radius: 999px; padding: 3px 10px; font: 700 13px var(--ui); color: var(--dim); cursor: pointer; white-space: nowrap; }
  .peekhead button:hover { color: var(--ink); background: var(--hover); }
  .peek pre { margin: 0; padding: 6px 14px 12px; max-height: 280px; overflow: auto; font: 500 13.5px/1.5 var(--mono); white-space: pre; user-select: text; background: none; border-radius: 0; }
  .peek mark { background: color-mix(in srgb, var(--color) 28%, transparent); color: inherit; border-radius: 3px; }
  /* Copy (code blocks, replies) and Send to…: words, shown on hover. */
  .copy { border: 0; background: none; padding: 0 2px; font: 700 13px var(--ui); color: var(--dim); cursor: pointer; }
  .copy:hover { color: var(--ink); }
  .copy::after { content: attr(data-label); }
  .msg .code .copy { position: absolute; top: 8px; right: 8px; background: var(--paper); border-radius: 999px; padding: 2px 10px; opacity: 0; transition: opacity .15s; }
  .msg .code:hover .copy, .msg .code .copy:focus-visible { opacity: 1; }
  .msg .copyreply, .msg .fwd { position: absolute; bottom: -4px; background: var(--paper); border-radius: 999px; padding: 2px 10px; opacity: 0; transition: opacity .15s; }
  .msg .copyreply { right: -6px; }
  .msg .fwd { right: 56px; }
  .msg.claude:hover .copyreply, .msg .copyreply:focus-visible, .msg.claude:hover .fwd, .msg .fwd:focus-visible { opacity: 1; }
  .fwdmenu { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .fwdmenu button { display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 999px; padding: 4px 12px 4px 10px; background: var(--soft); font: 700 13.5px var(--ui); color: var(--ink); cursor: pointer; }
  .fwdmenu button::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .fwdmenu button:hover { background: var(--hover); }
  /* What a turn came to, under its reply: how long, how many steps, which
     files (each with Undo on hover). */
  .turnmeta { margin-top: -6px; font: 600 14px/1.5 var(--ui); color: var(--faint); }
  .filelink { border: 0; background: none; padding: 0; font: inherit; color: var(--dim); cursor: pointer; text-decoration: underline; text-decoration-color: var(--underline); text-underline-offset: 3px; }
  .filelink:hover { color: var(--ink); }
  .turnmeta .undo { display: none; border: 0; background: var(--soft); border-radius: 999px; margin-left: 5px; padding: 0 8px; font: 700 12.5px/1.6 var(--ui); color: var(--dim); cursor: pointer; }
  .turnmeta .undo::after { content: attr(data-label); }
  .turnmeta:hover .undo, .turnmeta .undo:focus-visible { display: inline-block; }
  .turnmeta .undo:hover { color: var(--ink); background: var(--hover); }
  .turnmeta .undo:disabled { display: none; }
  .msg.folded { max-height: 30em; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent); }
  .more { align-self: flex-start; border: 0; border-radius: 999px; background: var(--soft); padding: 4px 13px; margin-top: -6px; font: 700 14px var(--ui); color: var(--ink); cursor: pointer; }
  .more:hover { background: var(--hover); }
  /* Under one of yours: queued, not sent, edit. */
  .meta { font: 600 13.5px var(--ui); color: var(--dim); margin: -8px 4px 0; align-self: flex-end; }
  .unsend { border: 0; background: none; padding: 0; font: inherit; font-weight: 800; color: var(--ink); cursor: pointer; text-decoration: underline; text-decoration-color: var(--underline); text-underline-offset: 3px; }
  .unsend:hover { text-decoration-color: var(--ink); }
  .msg.you + .meta.edit { opacity: 0; transition: opacity .15s; }
  .msg.you:hover + .meta.edit, .meta.edit:hover, .meta.edit:focus-within { opacity: 1; }
  /* Small things that happened: centred, quiet. */
  .note { align-self: center; font: 600 14px/1.45 var(--ui); color: var(--dim); text-align: center; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; }
  .note.error { color: var(--red); white-space: normal; background: var(--errbg); border-radius: 14px; padding: 8px 14px; align-self: stretch; text-align: left; }
  .note.long { white-space: normal; max-width: 100%; align-self: stretch; text-align: left; background: var(--softer); border-radius: 16px; padding: 10px 14px; user-select: text; }
  .note.context { align-self: stretch; white-space: normal; text-align: left; }
  .statusmore { margin-top: 4px; text-align: left; }
  .statusmore summary { cursor: pointer; color: var(--ink); font-weight: 700; }
  .statusmore .stitle { font-weight: 800; color: var(--ink); margin: 8px 0 2px; }
  .statusmore dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 0; }
  .statusmore dt { color: var(--dim); }
  .statusmore dd { margin: 0; overflow-wrap: anywhere; color: var(--ink); }
  .ctxbar { display: flex; height: 12px; margin: 8px 0 6px; border-radius: 6px; overflow: hidden; background: var(--soft); }
  .ctxbar .seg { display: block; height: 100%; min-width: 2px; }
  .ctxbar .seg.used, .ctxkeys .key.used::before { background: color-mix(in srgb, var(--color, #D97757) calc(100% - var(--i, 0) * 14%), var(--soft)); }
  .ctxbar .seg.buffer, .ctxkeys .key.buffer::before { background: repeating-linear-gradient(45deg, var(--faint) 0 2px, transparent 2px 5px); }
  .ctxbar .seg.free { background: none; }
  .ctxkeys { display: flex; flex-wrap: wrap; gap: 3px 14px; font-size: 13.5px; }
  .ctxkeys .key::before { content: ''; display: inline-block; width: 9px; height: 9px; margin-right: 6px; border-radius: 2px; vertical-align: 0; background: var(--soft); }
  /* A question asked on the side (/btw), and its answer. */
  .aside { align-self: stretch; padding: 10px 14px; border-radius: 16px; background: var(--softer); font: 500 15px/1.55 var(--ui); color: var(--body); user-select: text; }
  .asideq { font: 700 13.5px var(--ui); color: var(--dim); margin-bottom: 4px; }
  .asideq::before { content: 'Asked on the side: '; }
  /* Where what came in since you last looked begins. */
  .since { display: flex; align-items: center; gap: 10px; margin: 2px 0; font: 700 13px var(--ui); color: var(--color); }
  .since::before, .since::after { content: ''; flex: 1; height: 2px; border-radius: 1px; background: currentColor; opacity: .3; }
  .since.old { color: var(--faint); }
  body.searching .since { display: none; }
  .earlierbtn { align-self: center; border: 0; border-radius: 999px; padding: 5px 14px; background: var(--soft); font: 700 14px var(--ui); color: var(--ink); cursor: pointer; }
  .earlierbtn:hover { background: var(--hover); }
  .earlierbtn:disabled { cursor: default; color: var(--dim); }
  .earlier { display: contents; }

  /* What it did between replies: a soft group of plain rows, one per step
     ("Read talk.js", "Ran the tests"); a step with more to it opens with
     Show details. A long run shows its last few, the rest a tap away. */
  .steps { display: flex; flex-direction: column; gap: 1px; padding: 6px; border-radius: 18px; background: var(--softer); }
  .step { display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 4px 10px; border-radius: 12px; font: 600 14.5px/1.4 var(--ui); color: var(--body); user-select: text; position: relative; }
  .step::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--color); opacity: .6; }
  .step .what { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step .fail { flex: none; padding: 1px 9px; border-radius: 999px; background: var(--errbg); color: var(--red); font: 800 12.5px var(--ui); }
  .step.failed { color: var(--red); }
  .step.failed::before { background: #e05a4f; opacity: 1; }
  .step.new { animation: squish .3s cubic-bezier(.3, 1.6, .5, 1); transform-origin: 0 50%; }
  button.step { width: 100%; border: 0; background: none; margin: 0; text-align: left; cursor: pointer; }
  button.step::after { content: "Show details"; flex: none; font: 700 13px var(--ui); color: var(--dim); }
  button.step.open::after { content: "Hide details"; }
  button.step:hover { background: var(--paper); }
  button.step:hover::after { color: var(--ink); }
  .stepout { margin: 2px 4px 6px 28px; padding: 10px 14px; background: var(--paper); border-radius: 14px; font: 500 13.5px/1.5 var(--mono); color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow-y: auto; user-select: text; animation: squish .25s cubic-bezier(.3, 1.6, .5, 1); transform-origin: 0 0; position: relative; }
  .gitfiles .stepout, .branches .stepout { background: var(--paper); margin: 3px 0 6px; }
  .stepimg { padding: 6px; white-space: normal; max-height: none; }
  .stepimg img { display: block; max-width: 100%; max-height: 340px; margin: 0 auto; border-radius: 9px; }
  .stepout .copyout { float: right; margin: -3px -6px 0 8px; background: var(--soft); border-radius: 999px; padding: 2px 10px; opacity: 0; transition: opacity .15s; }
  .stepout:hover .copyout, .stepout .copyout:focus-visible { opacity: 1; }
  .steps:not(.open) .step.early, .steps:not(.open) .step.early + .stepout { display: none; }
  .steps .earlier { display: block; align-self: flex-start; border: 0; background: none; border-radius: 999px; padding: 3px 10px; margin: 0 0 2px; font: 700 13.5px var(--ui); color: var(--dim); cursor: pointer; }
  .steps .earlier:hover { color: var(--ink); background: var(--paper); }
  /* It's working: three hopping dots and what it's on, and its helpers. */
  .dots { align-self: stretch; display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding: 4px 0; max-width: 100%; }
  .dots i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--color); animation: bob 1.1s steps(3) infinite; transform-origin: 50% 100%; }
  /* (In steps, not smoothly: a smooth one redraws the whole box every screen
     refresh, 144 times a second on a fast screen, which cost more GPU than
     all the slimes; too small to see the difference.) */
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  /* Each dot hops like a tiny slime: squashed on landing, stretched in the air. */
  @keyframes bob { 0%, 68%, 100% { transform: none; } 12% { transform: scale(1.15, .85); } 35% { transform: translateY(-5px) scale(.9, 1.1); } 55% { transform: scale(1.25, .75); } }
  .dots .doing { flex: 0 1 auto; min-width: 0; margin-left: 8px; font: 700 15px var(--ui); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dots .bgit { margin-left: 8px; border: 0; border-radius: 999px; padding: 3px 12px; background: var(--soft); font: 700 13px var(--ui); color: var(--ink); cursor: pointer; }
  .dots .bgit:hover { background: var(--hover); }
  .dots .helpers { flex-basis: 100%; margin: 6px 0 0; padding: 6px 10px; list-style: none; border-radius: 14px; background: var(--softer); }
  .dots .helpers:empty { display: none; }
  .dots .helpers li { font: 600 14px/1.6 var(--ui); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 16px; position: relative; }
  .dots .helpers li::before { content: ''; position: absolute; left: 2px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: var(--color); opacity: .6; }
  .dots .helpers li b { font-weight: 800; color: var(--ink); }
  .dots .helpers li.wants b { color: var(--red); }

  /* ---- Every session at a glance, in place of the chat ---- */
  .glance { display: none; flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 16px 16px; flex-direction: column; gap: 4px; }
  body.overview .glance { display: flex; }
  body.overview #log, body.overview .side, body.overview .quick, body.overview .files, body.overview .suggest, body.overview .mode, body.overview form, body.overview .ask, body.overview .hint, body.overview .others { display: none !important; }
  .glance .row { position: relative; display: flex; flex-direction: column; text-align: left; border: 0; background: none; border-radius: 18px; padding: 9px 14px 9px 36px; cursor: pointer; color: var(--ink); font: 600 14.5px/1.4 var(--ui); }
  .glance .row:hover, .glance .row.here { background: var(--softer); }
  .glance .row::before { content: ""; position: absolute; left: 14px; top: 15px; width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
  .glance .row.wants::after { content: ""; position: absolute; left: 23px; top: 11px; width: 7px; height: 7px; border-radius: 50%; background: #ff4d6d; }
  .glance .row b { font: 800 16px var(--ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .glance .row .status { color: var(--body); overflow-wrap: anywhere; }
  .glance .row.wants .status { color: var(--red); }
  .glance .row small { font: 600 13.5px var(--ui); color: var(--dim); }
  .glance .row.past { padding-left: 14px; }
  .glance .row.past::before { display: none; }
  .glance .row.past b { font: 700 15px var(--ui); }
  .glance .row.found { flex-wrap: wrap; }
  .glance .row b .title { font-style: normal; font-weight: 600; color: var(--dim); margin-left: 6px; }
  .glance .hubhead { margin: 14px 14px 6px; font: 800 12px var(--ui); color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
  .glance .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px; }
  .glance .chips button { border: 0; border-radius: 999px; padding: 6px 14px; background: var(--soft); color: var(--ink); font: 700 14px var(--ui); cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .glance .chips button:hover { background: var(--hover); }
  .glance .chips button.dim { background: none; color: var(--dim); }
  .glance .chips button.dim:hover { color: var(--ink); background: var(--softer); }
  .cloneform { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
  .cloneform input { flex: 1; min-width: 0; border: 0; border-radius: 999px; padding: 6px 14px; background: var(--soft); color: var(--ink); font: 600 14px var(--ui); outline: none; }
  .glance .chips .cloneform button { background: var(--ink); color: var(--paper); }
  .clonesaid { flex-basis: 100%; color: var(--red); font: 600 13.5px var(--ui); padding: 0 6px; }
  .clonesaid:empty { display: none; }
  .glance .rowask { display: flex; align-items: center; gap: 6px; margin: -2px 14px 6px 36px; font: 600 13.5px var(--ui); color: var(--dim); }
  .glance .rowask span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .glance .rowask button { flex: none; border: 0; border-radius: 999px; padding: 4px 12px; background: var(--soft); color: var(--ink); font: 700 13.5px var(--ui); cursor: pointer; }
  .glance .rowask button.allow { background: var(--c); color: #fff; }
  .glance .today { margin: 4px 14px 6px; font: 700 14px var(--ui); color: var(--dim); }
  .glance .signedout { margin: 4px 14px 8px; font: 700 14px var(--ui); color: var(--red); }
  .glance .signedout button { border: 0; border-radius: 999px; padding: 3px 12px; background: var(--color); color: var(--on); font: inherit; cursor: pointer; }
  .planfirst { display: flex; align-items: center; gap: 6px; font: 600 14px var(--ui); color: var(--dim); cursor: pointer; }
  .planfirst input { accent-color: var(--color); margin: 0; }
  .newopts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin: 0 14px 10px; }
  .newmodel { margin-left: auto; border: 0; border-radius: 999px; padding: 3px 8px; background: var(--soft); font: 600 13.5px var(--ui); color: var(--ink); cursor: pointer; }

  /* ---- A question for you: permission, a choice, a plan ---- */
  /* A card of its own, tinted with the slime's colour, so it can't be
     missed: what it wants in plain words, the details, and big buttons. */
  .ask { margin: 0 14px 10px; padding: 16px 18px 14px; border-radius: 24px; background: color-mix(in srgb, var(--color) var(--tint), var(--paper)); flex: 0 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
  .ask > * { flex: none; }
  .ask.new { animation: squish .3s cubic-bezier(.3, 1.6, .5, 1); transform-origin: 50% 100%; }
  .ask .what { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin-bottom: 10px; }
  .ask .what b { font: 800 17px/1.35 var(--ui); color: var(--ink); }
  .ask .what span { font: 600 14px var(--ui); color: var(--dim); }
  #askDetail { display: block; font: 500 14px/1.5 var(--mono); background: var(--paper); color: var(--ink); border-radius: 16px; padding: 10px 14px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 180px; overflow-y: auto; user-select: text; }
  .ask #askQuestions, .ask .plan { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
  #askQuestions::-webkit-scrollbar { width: 0; } /* the fade says there's more */
  .ask .plan::-webkit-scrollbar, #askDetail::-webkit-scrollbar { width: 6px; }
  .ask .plan::-webkit-scrollbar-thumb, #askDetail::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px; }
  .ask .plan:hover::-webkit-scrollbar-thumb, #askDetail:hover::-webkit-scrollbar-thumb { background: var(--line); }
  #askQuestions.overflowing, .ask .plan.overflowing { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent); }
  .ask .plan { max-width: none; background: var(--paper); border-radius: 18px; padding: 12px 16px; user-select: text; }
  .q + .q { margin-top: 16px; }
  .q .text { font: 700 16px/1.45 var(--ui); margin: 0 0 8px; }
  .q .text span { font: 600 14px var(--ui); color: var(--dim); }
  .opts { display: flex; flex-direction: column; gap: 6px; }
  .opts.chips { flex-direction: row; flex-wrap: wrap; }
  .opt { text-align: left; border: 0; border-radius: 18px; padding: 10px 16px; background: var(--paper); color: var(--ink); font: 700 16px/1.35 var(--ui); cursor: pointer; transition: background .12s, transform .12s; }
  .chips .opt { border-radius: 999px; padding: 8px 16px; }
  .opt small { display: block; font: 600 14px/1.35 var(--ui); color: var(--dim); margin-top: 2px; }
  .opt:hover { background: var(--softer); }
  .opt:active { transform: scale(.98); }
  .opt.on { background: var(--color); color: var(--on); }
  .opt.on small { color: inherit; opacity: .85; }
  .opt.picked { animation: squish .3s cubic-bezier(.3, 1.6, .5, 1); }
  .opt:disabled { opacity: .5; cursor: default; }
  .opt:focus-visible { outline: 2px solid var(--color); outline-offset: 1px; }
  .otherchip { margin-top: 6px; border: 0; background: none; padding: 4px 0; font: 700 14px var(--ui); color: var(--dim); cursor: pointer; text-align: left; }
  .otherchip:hover { color: var(--ink); }
  .other { width: 100%; margin-top: 6px; border: 0; border-radius: 999px; padding: 9px 16px; font: 600 16px var(--ui); color: var(--ink); background: var(--paper); outline: none; user-select: text; }
  .other::placeholder { color: var(--faint); }
  .asknote { font: 600 14px var(--ui); color: var(--dim); margin-top: 10px; }
  .asknote:empty { display: none; }
  .ask .row { display: flex; gap: 8px; margin-top: 12px; }
  .ask .row button { flex: 1; height: 46px; border: 0; border-radius: 999px; padding: 0 12px; font: 800 16px var(--ui); cursor: pointer; background: var(--paper); color: var(--ink); }
  .ask .row button.allow { background: var(--color); color: var(--on); }
  .ask .row button:hover { filter: brightness(0.97); }
  .ask button:disabled { opacity: .5; cursor: default; }
  .ask .row button.allow:disabled { opacity: 1; background: var(--paper); color: var(--faint); }
  .ask .always { display: block; width: 100%; margin-top: 8px; border: 0; border-radius: 999px; background: var(--glass); padding: 9px 14px; font: 700 14px var(--ui); color: var(--ink); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ask .always:hover { background: var(--paper); }
  .ask .keys { margin-top: 8px; font: 600 13px var(--ui); color: var(--dim); text-align: center; }
  .ask .keys:empty { display: none; }
  /* Several questions: the card is the whole conversation for now. */
  body.carding form, body.carding .mode { display: none; }
  body.carding .ask { margin-bottom: 16px; }

  /* ---- Bottom: what to say next ---- */
  .hint { margin: 0 var(--side) 10px; color: var(--dim); font: 600 14px/1.45 var(--ui); text-align: center; text-wrap: balance; }
  .hint:empty { display: none; }
  /* What you might ask for next, one tap each. */
  .quick { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 0 16px 10px; }
  .quick button { border: 0; border-radius: 999px; padding: 6px 14px; background: var(--soft); color: var(--ink); font: 700 14px var(--ui); cursor: pointer; animation: squish .3s cubic-bezier(.3, 1.6, .5, 1); }
  .quick button:hover { background: var(--hover); }
  .quick button:active { transform: scale(.95); }
  .quick button.careful { color: var(--dim); }
  .quick button.sure { background: #d04a3c; color: #fff; }
  /* Pasted images and dropped files, waiting to go with the next message. */
  .files { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 8px; }
  .file { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; background: var(--soft); border-radius: 999px; padding: 4px 6px 4px 13px; font: 600 14px var(--ui); color: var(--ink); animation: squish .3s cubic-bezier(.3, 1.6, .5, 1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file button { border: 0; background: none; width: 22px; height: 22px; border-radius: 50%; padding: 0; font: 700 15px/1 var(--ui); color: var(--dim); cursor: pointer; }
  .file button:hover { color: var(--ink); background: var(--hover); }
  body.dropping .bubble { background: var(--paper)af7; }
  .editing { display: flex; gap: 8px; justify-content: space-between; align-items: center; font: 600 14px var(--ui); color: var(--dim); padding: 0 22px 8px; }
  /* "@" for a file and "/" for a command, as in the terminal. */
  .suggest { list-style: none; margin: 0 16px 8px; padding: 5px; background: var(--soft); border-radius: 18px; max-height: 240px; overflow-y: auto; animation: squish .25s cubic-bezier(.3, 1.6, .5, 1); }
  .suggest button { display: flex; gap: 10px; align-items: baseline; width: 100%; border: 0; background: none; border-radius: 12px; padding: 6px 12px; font: 700 14.5px var(--ui); color: var(--ink); text-align: left; cursor: pointer; overflow: hidden; white-space: nowrap; }
  .suggest button.on { background: var(--paper); }
  .suggest .pick { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .suggest .about { flex: 1; min-width: 0; color: var(--dim); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  /* The field: a soft box with room to write, and under the words its
     buttons: Attach on the left, Stop and Send on the right. */
  form { margin: 0 14px 14px; padding: 12px 10px 10px 18px; display: flex; flex-direction: column; gap: 6px; border-radius: 24px; background: var(--soft); }
  textarea { width: 100%; resize: none; border: 0; padding: 2px 6px 2px 0; font: 500 16px/1.5 var(--ui); color: var(--ink); background: none; min-height: 48px; max-height: 200px; outline: none; overflow-y: hidden; user-select: text; }
  textarea::placeholder { color: var(--faint); }
  textarea:disabled { opacity: .6; }
  .formbar { display: flex; align-items: center; gap: 8px; margin-left: -8px; }
  .formbar .spacer { flex: 1; }
  .formbar button { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 36px; border: 0; border-radius: 999px; padding: 0 14px; font: 800 14.5px var(--ui); cursor: pointer; transition: background .15s, color .15s, transform .15s; }
  .formbar button svg { width: 16px; height: 16px; flex: none; }
  .formbar button:not(:disabled):active { transform: scale(.94); }
  button.attach { background: none; color: var(--dim); padding: 0 10px; font-weight: 700; }
  button.attach:hover { color: var(--ink); background: var(--hover); }
  #send { background: var(--color); color: var(--on); padding: 0 16px 0 18px; }
  #send:disabled { background: var(--offbtn); color: var(--faint); cursor: default; }
  /* Stop: there while it works, beside Send. */
  .stop { background: var(--ink); color: var(--paper); animation: squish .3s cubic-bezier(.3, 1.6, .5, 1); }
  .stop i { width: 10px; height: 10px; border-radius: 2.5px; background: currentColor; }
  .stop:hover { background: var(--inkhover); }
  .stop:disabled { cursor: default; background: var(--offbtn); color: var(--dim); }
  /* Its model, how full it is and how it asks, under the field, as the
     terminal shows it under its prompt (Shift+Tab changes how it asks). */
  .mode { align-self: flex-start; max-width: calc(100% - 44px); margin: -8px 24px 12px; border: 0; background: none; padding: 2px 4px; font: 700 13.5px/1.45 var(--ui); color: var(--dim); cursor: default; text-align: left; }
  .mode.can { cursor: pointer; }
  .mode.can:hover { color: var(--ink); }
  .mode.acceptEdits { color: var(--violet); }
  .mode.plan { color: var(--teal); }
  .mode.bypassPermissions { color: #c2453b; }
  .mode .model { color: var(--dim); font-weight: 600; }
  .mode .model.full { color: var(--red); }
  .mode .model.ctx { cursor: pointer; }
  .mode .model.ctx:hover { text-decoration: underline; }
  .mode kbd { font: inherit; font-weight: 600; color: var(--faint); margin-left: 8px; }
  /* Less motion when the system asks for it (the box, not the slimes:
     their physics is how they talk). */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="grips" aria-hidden="true"><i data-edge="n"></i><i data-edge="s"></i><i data-edge="e"></i><i data-edge="w"></i><i data-edge="nw"></i><i data-edge="ne"></i><i data-edge="sw"></i><i data-edge="se"><svg viewBox="0 0 12 12"><circle cx="10" cy="3" r="1.4"/><circle cx="10" cy="10" r="1.4"/><circle cx="3" cy="10" r="1.4"/><circle cx="6.5" cy="6.5" r="1.4"/></svg></i></div>
<div class="wrap" id="wrap">
  <div class="bubble">
    <header>
      <div class="titlebar">
        <span class="name" id="name"></span>
        <span class="spacer"></span>
        <button class="tbtn" id="terminal" type="button" title="Go to its terminal (or Alt-click the blob)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7l5 5-5 5M12 17h7"/></svg>Terminal</button>
        <button class="round" id="theme" type="button" title="Dark mode" aria-label="Dark mode" aria-pressed="false"><svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4.6"/><g stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></g></svg></button>
        <button class="round" id="pin" type="button" title="Keep it open" aria-label="Keep it open" aria-pressed="false"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 3h7l-1.2 6.2 3.2 3.3V15h-11v-2.5l3.2-3.3z"/><path d="M11 15h2v5.5l-1 1.5-1-1.5z"/></svg></button>
        <button class="round" id="close" type="button" title="Close (Esc)" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
      </div>
      <div class="statusbar">
        <span class="state" id="stateChip"><i id="dot"></i><span id="state"></span></span>
        <span class="subname" id="subname" hidden title="Its name (double-click to rename it)"></span>
        <span class="spacer"></span>
        <button class="tbtn all" id="allSessions" type="button" aria-expanded="false"><span>All sessions</span><span class="count" id="sessionCount" hidden></span></button>
      </div>
      <nav class="others" id="others" aria-label="Sessions"></nav>
    </header>
    <div class="side" id="side">
      <button class="git" id="git" type="button" hidden aria-expanded="false"></button>
      <ul class="gitfiles" id="gitFiles" hidden></ul>
      <div class="branches" id="branches" hidden></div>
      <div class="todo" id="todo" hidden>
        <button id="todoHead" type="button"><span class="bar"><i id="todoFill"></i></span><span id="todoNow"></span><span id="todoCount"></span></button>
        <ul id="todoList" hidden></ul>
      </div>
      <ul class="bg" id="bg" hidden aria-label="Running in the background"></ul>
      <ul class="bg mcp" id="mcp" hidden aria-label="Tools that aren’t connected"></ul>
    </div>
    <div class="findbar" id="findBar" hidden><input id="find" type="search" placeholder="Find in this conversation…" aria-label="Find in this conversation"><span id="findCount"></span></div>
    <button class="toast" id="toast" type="button" hidden aria-live="polite"></button>
    <div id="log" role="log" aria-live="polite" aria-label="Conversation"><div id="inner"></div></div>
    <div class="glance" id="overview"></div>
    <div class="ask" id="ask" role="group" aria-labelledby="askWhat" hidden>
      <div class="what"><b id="askWhat" aria-live="assertive"></b><span id="askMore"></span></div>
      <code id="askDetail"></code>
      <div id="askQuestions"></div>
      <div class="plan msg" id="askPlan" hidden></div>
      <div class="asknote" id="askNote"></div>
      <div class="row" id="askRow">
        <button id="deny" type="button">Deny</button>
        <button id="allow" type="button" class="allow">Allow</button>
      </div>
      <button class="always" id="always" type="button" title="Allow this, and don’t ask again"></button>
      <div class="keys" id="askKeys"></div>
    </div>
    <div class="hint" id="hint"></div>
    <div class="quick" id="quick" hidden></div>
    <div class="files" id="files" hidden></div>
    <div class="editing" id="editing" hidden><span>Editing your message: it goes back to before it, then this goes instead.</span><button type="button" id="editCancel" class="unsend">Cancel</button></div>
    <ul class="suggest" id="suggest" hidden role="listbox" aria-label="Suggestions"></ul>
    <form id="form">
      <textarea id="text" rows="2" placeholder="Message Claude…" aria-label="Message"></textarea>
      <div class="formbar">
        <button id="attach" class="attach" type="button" title="Add files to your message (or paste an image, or drop files on the box)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.5 12 20a5.5 5.5 0 0 1-7.8-7.8l8.5-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8"/></svg>Attach</button>
        <span class="spacer"></span>
        <button class="stop" id="stop" type="button" hidden aria-label="Stop it"><i></i><span>Stop</span></button>
        <button id="send" type="submit" disabled>Send<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg></button>
      </div>
    </form>
    <button class="mode" id="mode" type="button" hidden></button>
  </div>
</div>
<script src="talk.js"></script>
</body>
</html>
