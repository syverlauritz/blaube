<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
<title>Talk</title>
<style>
  @font-face { font-family: "Coiny"; src: url(../renderer/fonts/Coiny.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: "Concert One"; src: url(../renderer/fonts/ConcertOne.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: "DynaPuff"; src: url(../renderer/fonts/DynaPuff.woff2) format("woff2"); font-weight: 400 700; }
  @font-face { font-family: "Nunito"; src: url(../renderer/fonts/Nunito.woff2) format("woff2"); font-weight: 200 1000; }
  @font-face { font-family: "Rubik Spray Paint"; src: url(../renderer/fonts/RubikSprayPaint.woff2) format("woff2"); font-weight: 400; }
  /* The same flat white bubble as everything Blaube says (docs/DESIGN.md),
     kept as plain as the bubbles on the desktop: white, ink #1b2440, one
     soft grey for things you can touch or type in, and the slime's own
     colour only on the one thing to press. No outlines, no shadows. Its
     tail is drawn by the slime's layer (from under the bubble to the
     slime), since the bubble drifts after the slime in its own window. */
  :root {
    --ink: #1b2440; --dim: #5b6270; --faint: #9aa0ad; --soft: #f1f2f6; --on: #fff;
    --color: #d97757; --name: "Nunito", system-ui, sans-serif;
    /* Rounded letters, like everything else about a slime (Nunito, bundled). */
    --ui: "Nunito", system-ui, sans-serif;
    --ox: 50%; --oy: 100%;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; font: 600 16px/1.45 var(--ui); color: var(--ink); overflow: hidden; user-select: none; }
  .wrap { position: absolute; inset: 0; transform-origin: var(--ox) var(--oy); }
  .wrap.pop { animation: pop .26s cubic-bezier(.3, 1.5, .5, 1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .wrap.shut { animation: shut .17s cubic-bezier(.5, 0, .8, .4) forwards; }
  @keyframes shut { to { transform: scale(.7, .6); opacity: 0; } }
  .wrap.boing { animation: boing .34s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes boing { 35% { transform: scale(1.02, .975); } 70% { transform: scale(.995, 1.01); } }
  @keyframes squish { from { transform: scale(.8, .6); opacity: 0; } to { transform: none; opacity: 1; } }
  /* 12 px clear round the bubble, so its pop and wobble never get cut off. */
  .bubble { position: absolute; inset: 12px; display: flex; flex-direction: column; background: #fff; border-radius: 30px; overflow: hidden; }

  header { display: flex; align-items: center; gap: 8px; padding: 16px 14px 6px 22px; }
  /* Display fonts that come in one weight are drawn at it (a faked bold smudges). */
  .name.plain { font-family: var(--ui); --nameWeight: 800; }
  .name { font: var(--nameWeight, 700) 18px var(--name); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 0 1 auto; }
  /* The slime's face says how it is: no state words up here. */
  .state { display: none; }
  .spacer { flex: 1; min-width: 12px; }
  /* Close (and terminal): soft little pebbles, like the send button. */
  .round { border: 0; background: var(--soft); color: var(--dim); width: 30px; height: 30px; border-radius: 50%; padding: 0; cursor: pointer; flex: none; display: grid; place-items: center; }
  .round svg { width: 13px; height: 13px; }
  .round:hover { background: var(--soft); color: var(--ink); }
  /* Going to the terminal is there when you want it, not in the way. */
  #terminal { opacity: 0; transition: opacity .2s; position: absolute; right: 44px; top: 13px; }
  header:hover #terminal, #terminal:focus-visible { opacity: 1; }

  /* Stop: there while it works, out of the way otherwise. A soft pill with
     a little square, the one thing that looks like "stop" everywhere. */
  .stop { display: flex; align-items: center; gap: 6px; flex: none; border: 0; border-radius: 999px; padding: 5px 12px 5px 10px; background: var(--soft); color: var(--dim); font: 700 14px var(--ui); cursor: pointer; animation: squish .3s cubic-bezier(.3, 1.6, .5, 1); }
  .stop[hidden] { display: none; }
  .stop i { width: 9px; height: 9px; border-radius: 2.5px; background: currentColor; }
  .stop:hover { color: var(--ink); }
  .stop:disabled { cursor: default; color: var(--faint); }

  /* Every slime as a dot in its colour, to hop between them; the one you're
     talking to is bigger, and one that needs you has a red pip. */
  .others { display: flex; align-items: center; gap: 5px; flex: none; margin-right: 4px; }
  .others button { position: relative; width: 12px; height: 12px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; background: var(--c); transition: transform .15s cubic-bezier(.3, 1.6, .5, 1); }
  .others button:hover { transform: scale(1.25); }
  .others button.here { width: 16px; height: 16px; cursor: default; }
  .others button.wants::after { content: ""; position: absolute; right: -3px; top: -3px; width: 7px; height: 7px; border-radius: 50%; background: #ff4d6d; }
  .others button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .others button.all { width: 22px; height: 22px; background: var(--soft); color: var(--dim); display: grid; place-items: center; margin-left: 3px; }
  .others button.all svg { width: 12px; height: 12px; }
  .others button.all:hover { color: var(--ink); transform: none; }
  body.overview .others button.all { background: var(--color); color: var(--on); }
  /* The overview: every session, a row each, in place of the chat. */
  .glance { display: none; flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 2px 14px 16px; flex-direction: column; gap: 4px; }
  body.overview .glance { display: flex; }
  body.overview #log, body.overview .todo, body.overview .git, body.overview .gitfiles, body.overview .bg, body.overview .quick, body.overview .files, body.overview .suggest, body.overview .mode, body.overview form, body.overview .ask, body.overview .hint, body.overview #stop { display: none; }
  .glance .row { position: relative; display: flex; flex-direction: column; text-align: left; border: 0; background: none; border-radius: 20px; padding: 8px 12px 8px 32px; cursor: pointer; color: var(--ink); font: 600 14px/1.35 var(--ui); }
  .glance .row:hover, .glance .row.here { background: var(--soft); }
  .glance .row::before { content: ""; position: absolute; left: 12px; top: 13px; width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
  .glance .row.wants::after { content: ""; position: absolute; left: 21px; top: 9px; width: 7px; height: 7px; border-radius: 50%; background: #ff4d6d; }
  .glance .row b { font: 800 16px var(--ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .glance .row .status { color: var(--ink); overflow-wrap: anywhere; }
  .glance .row.wants .status { color: #c0392b; }
  .glance .row small { font: 600 14px var(--ui); color: var(--dim); }
  /* Find (⌘F): a field over the log; what doesn't match steps aside. */
  .findbar { display: flex; align-items: center; gap: 8px; margin: 0 16px 6px; }
  .findbar[hidden] { display: none; }
  /* A word about what just happened (saved, copied); tap to see the file. */
  .toast { margin: 0 16px 6px; padding: 6px 12px; border: 0; border-radius: 999px; background: var(--soft); font: 600 13px var(--ui); color: var(--ink); text-align: left; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toast[hidden] { display: none; }
  .findbar input { flex: 1; min-width: 0; border: 0; border-radius: 999px; padding: 7px 14px; background: var(--soft); font: 600 14px var(--ui); color: var(--ink); outline: none; user-select: text; }
  .findbar input::placeholder { color: var(--faint); }
  #findCount { flex: none; font: 600 14px var(--ui); color: var(--dim); }
  body.searching #inner .miss, body.searching #inner .meta, body.searching #inner .more, body.searching .steps .earlier { display: none !important; }
  body.searching .steps .step.early { display: block; }
  body.searching .stepout:not(.miss) { display: block; animation: none; }
  .glance::-webkit-scrollbar { width: 6px; }
  .glance::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px; }
  .glance:hover::-webkit-scrollbar-thumb { background: #dfe2ea; }
  .glance .hubhead { margin: 12px 12px 4px; font: 700 14px var(--ui); color: var(--dim); }
  .glance .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 10px; }
  .glance .chips button { border: 0; border-radius: 999px; padding: 6px 13px; background: var(--soft); color: var(--ink); font: 700 14px var(--ui); cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .glance .chips button:hover { background: #e8eaf0; }
  .glance .chips button.dim { background: none; color: var(--dim); }
  .glance .rowask { display: flex; align-items: center; gap: 6px; margin: -2px 12px 6px 26px; font: 600 13px var(--ui); color: var(--dim); }
  .glance .rowask span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .glance .rowask button { flex: none; border: 0; border-radius: 999px; padding: 4px 11px; background: var(--soft); color: var(--ink); font: 700 13px var(--ui); cursor: pointer; }
  .glance .rowask button.allow { background: var(--c); color: #fff; }
  .glance .row.past { padding-left: 12px; }
  .glance .row.past::before { display: none; }
  .glance .row.past b { font: 700 15px var(--ui); }
  .glance .row.found { flex-wrap: wrap; }
  /* Its git status, quietly, under its name. */
  .git { margin: -4px 22px 6px; font: 600 14px var(--ui); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .git[hidden] { display: none; }
  button.git { display: block; border: 0; background: none; padding: 0; text-align: left; max-width: calc(100% - 44px); cursor: default; }
  button.git.opens { cursor: pointer; }
  button.git.opens:hover { color: var(--ink); }
  .gitfiles { margin: -2px 22px 8px; padding: 0; list-style: none; max-height: 160px; overflow-y: auto; }
  .gitfiles[hidden] { display: none; }
  .planfirst { float: right; display: flex; align-items: center; gap: 5px; font: 600 13px var(--ui); color: var(--dim); text-transform: none; letter-spacing: 0; cursor: pointer; }
  .planfirst input { accent-color: var(--color); margin: 0; }
  .since { display: flex; align-items: center; gap: 10px; margin: 6px 0; font: 600 12px var(--ui); color: var(--color); }
  .since::before, .since::after { content: ''; flex: 1; height: 1px; background: currentColor; opacity: .35; }
  body.searching .since { display: none; }
  .earlierbtn { align-self: center; margin: 0 0 6px; border: 0; border-radius: 999px; padding: 3px 12px; background: var(--soft); font: 600 13px var(--ui); color: var(--dim); cursor: pointer; }
  .earlierbtn:hover { color: var(--ink); }
  .earlierbtn:disabled { cursor: default; opacity: .7; }
  .earlier { display: contents; }
  .since.old { color: var(--faint); }
  .glance .row b .title { font-style: normal; font-weight: 500; color: var(--dim); margin-left: 6px; }
  .gitfiles button { display: flex; gap: 8px; width: 100%; border: 0; background: none; padding: 1px 0; font: 500 13px var(--ui); color: var(--dim); text-align: left; cursor: pointer; }
  .gitfiles button:hover { color: var(--ink); }
  .gitfiles button span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gitfiles button small { flex: none; font: 600 12px var(--ui); color: var(--faint); }
  .gitfiles .conflict small { color: #c0392b; }
  .gitfiles li { display: flex; flex-wrap: wrap; align-items: center; }
  .gitfiles li > button:first-child { flex: 1; min-width: 0; width: auto; }
  .gitfiles .reveal { flex: none; width: auto; padding: 0 0 0 8px; color: var(--faint); }
  .gitfiles .diff { flex-basis: 100%; margin: 3px 0 6px; font-size: 12px; max-height: 200px; }
  .diff .add, #askDetail .add { color: #1e7e34; }
  .diff .del, #askDetail .del { color: #c0392b; }
  .diff .hunk { color: var(--faint); }
  .link { color: inherit; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--color) 70%, transparent); text-underline-offset: 2px; cursor: pointer; word-break: break-all; }
  .link:hover { text-decoration-color: var(--color); }
  /* What it left running in the background (a dev server, a watcher). */
  .bg { margin: -2px 22px 6px; padding: 0; list-style: none; }
  .bg[hidden] { display: none; }
  .bg li { display: flex; align-items: center; gap: 8px; font: 600 14px var(--ui); color: var(--dim); }
  .bg li span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bg li span::before { content: ''; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 2px; background: var(--color); vertical-align: 1px; }
  .bg button { border: 0; border-radius: 999px; padding: 1px 10px; background: var(--soft); font: 600 13px var(--ui); color: var(--dim); cursor: pointer; }
  .bg button:hover { color: var(--ink); }
  .bg button:disabled { opacity: .5; cursor: default; }
  .bg li { flex-wrap: wrap; }
  .bg .bgout { flex: 1 0 100%; margin: 4px 0 6px; padding: 8px 12px; background: var(--soft); border-radius: 14px; font: 500 13px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 200px; overflow-y: auto; user-select: text; }
  .bg .bgout[hidden] { display: none; }
  .bg .bgout.failed { box-shadow: inset 3px 0 0 #d33; }
  .mcp li span::before { background: #d33; border-radius: 50%; }
  /* What you might ask for next, one tap each. */
  .quick { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 8px; }
  .quick[hidden] { display: none; }
  .quick button { border: 0; border-radius: 999px; padding: 6px 13px; background: var(--soft); color: var(--ink); font: 700 14px var(--ui); cursor: pointer; animation: squish .3s cubic-bezier(.3, 1.6, .5, 1); }
  .quick button:hover { background: #e8eaf0; }
  .quick button:active { transform: scale(.95); }

  /* Its to-do list: one line (how far, what now), the whole list a tap away. */
  .todo { margin: 0 16px 4px; flex: none; }
  .todo[hidden] { display: none; }
  #todoHead { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: var(--soft); border-radius: 999px; padding: 7px 14px; font: 600 14px var(--ui); color: var(--dim); cursor: pointer; text-align: left; }
  #todoHead:hover { color: var(--ink); }
  .todo .bar { flex: none; width: 34px; height: 8px; border-radius: 4px; background: #e2e4eb; overflow: hidden; }
  .todo .bar i { display: block; height: 100%; border-radius: 4px; background: var(--color); transition: width .4s cubic-bezier(.3, 1.4, .5, 1); }
  #todoNow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  #todoCount { flex: none; }
  #todoList { list-style: none; margin: 6px 0 2px; padding: 0 6px; max-height: 180px; overflow-y: auto; font: 600 14px/1.5 var(--ui); color: var(--dim); }
  #todoList[hidden] { display: none; }
  #todoList li { padding-left: 22px; position: relative; overflow-wrap: anywhere; }
  #todoList li::before { content: ""; position: absolute; left: 4px; top: .45em; width: 9px; height: 9px; border-radius: 50%; background: #dfe2ea; }
  #todoList li.in_progress { color: var(--ink); }
  #todoList li.in_progress::before { background: var(--color); }
  #todoList li.completed { color: var(--faint); text-decoration: line-through; }
  #todoList li.completed::before { background: var(--color); opacity: .4; }

  /* The log takes what's left; a tall card scrolls instead of pushing the field out. */
  #log { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 4px 22px 10px; }
  #log.scrolled { -webkit-mask-image: linear-gradient(to bottom, transparent 0, transparent 4px, #000 18px); }
  #log.squeezed { display: none; }
  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px; }
  #log:hover::-webkit-scrollbar-thumb { background: #dfe2ea; }
  #inner { display: flex; flex-direction: column; gap: 10px; padding-top: 2px; }
  .empty { color: var(--dim); padding: 4px 0 2px; }
  /* The slime talks in plain text, like its bubbles; you get a soft pill. */
  .msg { overflow-wrap: anywhere; user-select: text; white-space: pre-wrap; }
  .msg.claude { align-self: stretch; }
  .msg.you { align-self: flex-end; max-width: 82%; background: var(--soft); padding: 9px 15px; border-radius: 22px; }
  .msg.you.queued, .msg.you.unsent { color: var(--dim); }
  .msg.new { animation: squish .3s cubic-bezier(.3, 1.6, .5, 1); }
  .msg.claude.new { transform-origin: 0 100%; }
  .msg.you.new { transform-origin: 100% 100%; }
  .msg code { font: 500 14px ui-monospace, Menlo, Consolas, monospace; background: var(--soft); border-radius: 5px; padding: 1px 4px; }
  .msg .filelink { cursor: pointer; box-shadow: inset 0 -1.5px 0 var(--faint); }
  .msg .filelink:hover { box-shadow: inset 0 -1.5px 0 var(--color); }
  /* A file from a reply, opened in the box. */
  .peek { margin: 4px 0; white-space: normal; background: var(--soft); border-radius: 16px; overflow: hidden; animation: squish .25s cubic-bezier(.3, 1.6, .5, 1); transform-origin: 0 0; }
  .peekhead { display: flex; align-items: center; gap: 4px; padding: 6px 8px 0 12px; font: 600 13px var(--ui); color: var(--dim); }
  .peekhead span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .peekhead button { border: 0; background: none; width: 24px; height: 24px; border-radius: 50%; padding: 0; font: 700 13px var(--ui); color: var(--faint); cursor: pointer; }
  .peekhead button:hover { color: var(--ink); background: #e6e8ee; }
  .peek pre { margin: 0; padding: 6px 12px 10px; max-height: 240px; overflow: auto; font: 500 13px/1.45 ui-monospace, Menlo, Consolas, monospace; white-space: pre; user-select: text; }
  .peek mark { background: color-mix(in srgb, var(--color) 28%, transparent); color: inherit; border-radius: 3px; }
  .msg pre { margin: 4px 0; padding: 9px 12px; background: var(--soft); border-radius: 16px; font: 500 14px/1.4 ui-monospace, Menlo, Consolas, monospace; white-space: pre; overflow-x: auto; }
  .msg .head { font-weight: 700; }
  /* Code blocks and replies copy in a tap; the button shows on hover. */
  .msg .code { position: relative; }
  .copy { border: 0; background: none; padding: 0 2px; font: 600 14px var(--ui); color: var(--faint); cursor: pointer; }
  .copy:hover { color: var(--ink); }
  .copy::after { content: attr(data-label); }
  .msg .code .copy { position: absolute; top: 8px; right: 8px; background: var(--soft); border-radius: 999px; padding: 1px 8px; opacity: 0; transition: opacity .15s; }
  .msg .code:hover .copy, .msg .code .copy:focus-visible { opacity: 1; }
  /* What a turn came to, under its reply. */
  .turnmeta { margin-top: -6px; font: 600 14px var(--ui); color: var(--faint); }
  .msg.claude { position: relative; }
  .msg .copyreply { position: absolute; right: -6px; bottom: -2px; background: #fff; border-radius: 999px; padding: 1px 8px; opacity: 0; transition: opacity .15s; }
  .msg.claude:hover .copyreply, .msg .copyreply:focus-visible { opacity: 1; }
  .filelink { border: 0; background: none; padding: 0; font: inherit; color: var(--dim); cursor: pointer; text-decoration: underline; text-decoration-color: #dfe2ea; text-underline-offset: 3px; }
  .filelink:hover { color: var(--ink); }
  .turnmeta .undo { border: 0; background: none; padding: 0 0 0 3px; font: inherit; color: var(--faint); cursor: pointer; opacity: 0; transition: opacity .15s; }
  .turnmeta .undo::after { content: attr(data-label); }
  .turnmeta:hover .undo, .turnmeta .undo:focus-visible { opacity: 1; }
  .turnmeta .undo:hover { color: var(--ink); }
  .turnmeta .undo:disabled { opacity: 0; cursor: default; }
  .turnmeta .undo.all { margin-left: 6px; }
  .glance .today { margin: 2px 12px 6px; font: 700 14px var(--ui); color: var(--dim); }
  .msg.folded { max-height: 15.5em; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent); }
  .more { align-self: flex-start; border: 0; background: none; padding: 0; margin-top: -4px; font: 600 14px var(--ui); color: var(--dim); cursor: pointer; }
  .more:hover { color: var(--ink); }
  .meta { font: 600 14px var(--ui); color: var(--dim); margin: -6px 2px 0; align-self: flex-end; }
  .unsend { border: 0; background: none; padding: 0; font: inherit; color: var(--dim); cursor: pointer; }
  .unsend:hover { color: var(--ink); }
  .note { align-self: center; font: 600 14px var(--ui); color: var(--dim); text-align: center; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note.error { color: #c0392b; white-space: normal; }
  /* What it did between replies: small and quiet, a line per step; a long
     run shows its last few, with the rest a tap away. */
  .steps { display: flex; flex-direction: column; gap: 1px; margin: -2px 0; }
  .step { font: 600 14px/1.35 var(--ui); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: text; padding-left: 20px; position: relative; }
  .step::before { content: ""; position: absolute; left: 4px; top: .5em; width: 7px; height: 7px; border-radius: 50%; background: var(--color); opacity: .55; }
  .step.failed { color: #c0392b; }
  .step.failed::before { background: #e05a4f; opacity: 1; }
  .step.new { animation: squish .3s cubic-bezier(.3, 1.6, .5, 1); transform-origin: 0 50%; }
  button.step { border: 0; background: none; margin: 0; padding: 0 0 0 20px; text-align: left; cursor: pointer; }
  button.step:hover { color: var(--ink); }
  button.step::after { content: "›"; display: inline-block; margin-left: 6px; color: var(--faint); transition: transform .15s; }
  button.step.open::after { transform: rotate(90deg); }
  button.step.failed:hover { color: #a93226; }
  .stepout { margin: 3px 0 6px 20px; padding: 8px 12px; background: var(--soft); border-radius: 14px; font: 500 14px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow-y: auto; user-select: text; animation: squish .25s cubic-bezier(.3, 1.6, .5, 1); transform-origin: 0 0; }
  .stepout[hidden] { display: none; }
  .stepimg { padding: 6px; white-space: normal; max-height: none; }
  .stepimg img { display: block; max-width: 100%; max-height: 300px; margin: 0 auto; border-radius: 9px; }
  .stepout { position: relative; }
  .stepout .copyout { float: right; margin: -2px -4px 0 6px; background: var(--soft); border-radius: 999px; padding: 1px 8px; font-size: 13px; opacity: 0; transition: opacity .15s; }
  .stepout:hover .copyout, .stepout .copyout:focus-visible { opacity: 1; }
  .steps:not(.open) .step.early, .steps:not(.open) .step.early + .stepout { display: none; }
  .steps .earlier { align-self: flex-start; border: 0; background: none; padding: 0 0 1px 20px; font: 600 14px var(--ui); color: var(--faint); cursor: pointer; }
  .steps .earlier:hover { color: var(--ink); }
  .dots { align-self: flex-start; display: flex; gap: 5px; padding: 6px 0; }
  .dots { align-items: center; max-width: 100%; }
  .dots .doing { margin-left: 4px; font: 600 14px var(--ui); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dots .doing:empty { display: none; }
  .dots { flex-wrap: wrap; }
  .dots .helpers { flex-basis: 100%; margin: 2px 0 0; padding: 0; list-style: none; }
  .dots .helpers:empty { display: none; }
  .dots .helpers li { font: 500 13px var(--ui); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 1px 0 1px 12px; position: relative; }
  .dots .helpers li::before { content: ''; position: absolute; left: 1px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: var(--color); opacity: .6; }
  .dots .helpers li b { font-weight: 600; color: var(--ink); }
  .dots .helpers li.wants b { color: #c0392b; }
  .dots i { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--color); animation: bob 1.1s ease-in-out infinite; transform-origin: 50% 100%; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  /* Each dot hops like a tiny slime: squashed on landing, stretched in the air. */
  @keyframes bob { 0%, 68%, 100% { transform: none; } 12% { transform: scale(1.15, .85); } 35% { transform: translateY(-5px) scale(.9, 1.1); } 55% { transform: scale(1.25, .75); } }

  .hint { margin: 0 22px 8px; color: var(--dim); font: 600 14px/1.4 var(--ui); text-align: center; text-wrap: balance; }
  .hint:empty { display: none; }

  /* A question for you (permission, a choice, a plan): no box of its own,
     just room, the question, and the choices. */
  .ask { margin: 2px 22px 14px; flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .ask[hidden] { display: none; }
  .ask.new { animation: squish .3s cubic-bezier(.3, 1.6, .5, 1); transform-origin: 50% 100%; }
  .ask .what { display: flex; gap: 6px; align-items: baseline; margin-bottom: 8px; }
  .ask .what b { font-weight: 700; }
  .ask .what span { font: 600 14px var(--ui); color: var(--dim); }
  .ask[data-kind="question"] .what b { font: 600 14px var(--ui); color: var(--dim); }
  #askDetail { display: block; font: 500 14px/1.4 ui-monospace, Menlo, Consolas, monospace; background: var(--soft); border-radius: 16px; padding: 9px 13px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 78px; overflow-y: auto; user-select: text; }
  #askDetail[hidden] { display: none; }
  #askQuestions, .ask .plan { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
  #askQuestions::-webkit-scrollbar { width: 0; } /* the fade says there's more */
  .ask .plan::-webkit-scrollbar, #askDetail::-webkit-scrollbar { width: 6px; }
  .ask .plan::-webkit-scrollbar-thumb, #askDetail::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px; }
  .ask .plan:hover::-webkit-scrollbar-thumb, #askDetail:hover::-webkit-scrollbar-thumb { background: #dfe2ea; }
  #askQuestions.overflowing, .ask .plan.overflowing { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent); }
  .ask .plan { max-width: none; background: var(--soft); border-radius: 18px; padding: 11px 14px; user-select: text; }
  .ask .plan[hidden] { display: none; }
  .q + .q { margin-top: 14px; }
  .q .text { font-weight: 700; margin: 0 0 8px; }
  .q .text span { font: 600 14px var(--ui); color: var(--dim); }
  .opts { display: flex; flex-direction: column; gap: 6px; }
  .opts.chips { flex-direction: row; flex-wrap: wrap; }
  .opt { text-align: left; border: 0; border-radius: 20px; padding: 10px 16px; background: var(--soft); color: var(--ink); font: 700 16px/1.3 var(--ui); cursor: pointer; transition: background .12s, transform .12s; }
  .chips .opt { border-radius: 999px; padding: 7px 14px; }
  .opt small { display: block; font: 600 14px/1.3 var(--ui); color: var(--dim); margin-top: 1px; }
  .opt:hover { background: #e8eaf0; }
  .opt:active { transform: scale(.98); }
  .opt.on { background: var(--color); color: var(--on); }
  .opt.on small { color: inherit; opacity: .8; }
  .opt.picked { animation: squish .3s cubic-bezier(.3, 1.6, .5, 1); }
  .opt:disabled { opacity: .5; cursor: default; }
  .opt:focus-visible { outline: 2px solid var(--color); outline-offset: 1px; }
  /* Every text button looks the same: dim, 600, ink on hover. */
  .otherchip { margin-top: 4px; border: 0; background: none; padding: 4px 0; font: 600 14px var(--ui); color: var(--dim); cursor: pointer; text-align: left; }
  .otherchip:hover { color: var(--ink); }
  .otherchip[hidden], .other[hidden] { display: none; }
  .other { width: 100%; margin-top: 6px; border: 0; border-radius: 999px; padding: 9px 16px; font: 600 16px var(--ui); color: var(--ink); background: var(--soft); outline: none; user-select: text; }
  .other::placeholder { color: var(--faint); }
  .asknote { font: 600 14px var(--ui); color: var(--dim); margin-top: 8px; }
  .asknote:empty { display: none; }
  .ask .row { display: flex; gap: 8px; margin-top: 10px; }
  .ask .row[hidden] { display: none; }
  .ask .row button { flex: 1; border: 0; border-radius: 999px; padding: 11px 0; font: 700 15px var(--ui); cursor: pointer; background: var(--soft); color: var(--ink); }
  .ask .row button.allow { background: var(--color); color: var(--on); }
  .ask .row button:hover { filter: brightness(0.97); }
  .ask button:disabled { opacity: .5; cursor: default; }
  .ask .row button.allow:disabled { opacity: 1; background: var(--soft); color: var(--faint); }
  .ask .always { display: block; margin: 8px auto 0; border: 0; background: none; padding: 4px 0; font: 600 14px var(--ui); color: var(--dim); cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ask .always:hover { color: var(--ink); }
  .ask .always[hidden] { display: none; }
  /* Several questions: the card is the whole conversation for now. */
  body.carding form { display: none; }
  body.carding .ask { margin-bottom: 16px; }

  /* Pasted images and dropped files, waiting to go with the next message. */
  .files { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 6px; }
  .files[hidden] { display: none; }
  .file { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; background: var(--soft); border-radius: 999px; padding: 4px 6px 4px 12px; font: 600 14px var(--ui); color: var(--ink); animation: squish .3s cubic-bezier(.3, 1.6, .5, 1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file button { border: 0; background: none; width: 20px; height: 20px; border-radius: 50%; padding: 0; font: 700 15px/1 var(--ui); color: var(--dim); cursor: pointer; }
  .file button:hover { color: var(--ink); }
  body.dropping .bubble { background: #fffaf7; }
  /* Its permission mode, as the terminal shows it under the prompt (⇧⇥ changes it). */
  .mode { align-self: flex-start; margin: 0 22px 4px; border: 0; background: none; padding: 2px 0; font: 700 13px var(--ui); color: var(--dim); cursor: default; }
  .mode[hidden] { display: none; }
  .mode.can { cursor: pointer; }
  .mode.can:hover { color: var(--ink); }
  .mode.acceptEdits { color: #8a5cd0; }
  .mode.plan { color: #2f8f83; }
  .mode.bypassPermissions { color: #c2453b; }
  .mode .model { color: var(--dim); font-weight: 600; }
  .mode .model.full { color: #c0392b; }
  .mode kbd { font: inherit; color: var(--faint); margin-left: 6px; }
  /* "@" for a file and "/" for a command, as in the terminal. */
  .suggest { list-style: none; margin: 0 16px 6px; padding: 4px; background: var(--soft); border-radius: 16px; animation: squish .25s cubic-bezier(.3, 1.6, .5, 1); }
  .suggest[hidden] { display: none; }
  .suggest button { display: flex; gap: 8px; align-items: baseline; width: 100%; border: 0; background: none; border-radius: 12px; padding: 5px 10px; font: 600 14px var(--ui); color: var(--ink); text-align: left; cursor: pointer; overflow: hidden; white-space: nowrap; }
  .suggest button.on { background: #fff; }
  .suggest .pick { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .suggest .about { flex: 1; min-width: 0; color: var(--dim); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
  form { display: flex; gap: 8px; align-items: flex-end; padding: 2px 16px 16px; }
  textarea { flex: 1; resize: none; border: 0; border-radius: 22px; padding: 10px 16px; font: 600 16px/1.4 var(--ui); color: var(--ink); background: var(--soft); max-height: 104px; outline: none; overflow-y: hidden; user-select: text; }
  textarea::placeholder { color: var(--faint); }
  textarea:disabled { opacity: .6; }
  form button { flex: none; width: 42px; height: 42px; border: 0; border-radius: 50%; background: var(--color); color: var(--on); cursor: pointer; display: grid; place-items: center; transition: background .15s, color .15s, transform .15s; }
  form button svg { width: 18px; height: 18px; }
  form button:disabled { background: var(--soft); color: var(--faint); cursor: default; }
  form button.attach { width: 30px; height: 42px; margin-right: -4px; background: none; color: var(--faint); }
  form button.attach:hover { color: var(--ink); }
  form button.attach svg { width: 19px; height: 19px; }
  form button:not(:disabled):active { transform: scale(.88); }
  /* Less motion when the system asks for it (the box, not the slimes:
     their physics is how they talk). */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="bubble">
    <header>
      <span class="name" id="name"></span>
      <span class="state"><i id="dot"></i><span id="state"></span></span>
      <button class="stop" id="stop" hidden title="It stops before its next step" aria-label="Stop it before its next step"><i></i><span>Stop</span></button>
      <span class="spacer"></span>
      <span class="others" id="others"></span>
      <button class="round" id="terminal" title="Go to its terminal (or Alt-click the slime)" aria-label="Go to its terminal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7l5 5-5 5M12 17h7"/></svg></button>
      <button class="round" id="close" title="Close (Esc)" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
    </header>
    <button class="git" id="git" type="button" hidden aria-expanded="false"></button>
    <ul class="gitfiles" id="gitFiles" hidden></ul>
    <ul class="bg" id="bg" hidden aria-label="Running in the background"></ul>
    <ul class="bg mcp" id="mcp" hidden aria-label="Tools that aren’t connected"></ul>
    <div class="findbar" id="findBar" hidden><input id="find" type="search" placeholder="Find in this conversation…" aria-label="Find in this conversation"><span id="findCount"></span></div>
    <button class="toast" id="toast" type="button" hidden aria-live="polite"></button>
    <div class="todo" id="todo" hidden>
      <button id="todoHead"><span class="bar"><i id="todoFill"></i></span><span id="todoNow"></span><span id="todoCount"></span></button>
      <ul id="todoList" hidden></ul>
    </div>
    <div id="log" role="log" aria-live="polite" aria-label="Conversation"><div id="inner"></div></div>
    <div class="glance" id="overview"></div>
    <div class="ask" id="ask" role="group" aria-labelledby="askWhat" hidden>
      <div class="what"><b id="askWhat" aria-live="assertive"></b><span id="askMore"></span></div>
      <code id="askDetail"></code>
      <div id="askQuestions"></div>
      <div class="plan msg" id="askPlan" hidden></div>
      <div class="asknote" id="askNote"></div>
      <div class="row" id="askRow">
        <button id="deny">Deny</button>
        <button id="allow" class="allow">Allow</button>
      </div>
      <button class="always" id="always" title="Allow this, and don’t ask again"></button>
    </div>
    <div class="hint" id="hint"></div>
    <div class="quick" id="quick" hidden></div>
    <div class="files" id="files" hidden></div>
    <button class="mode" id="mode" type="button" hidden></button>
    <ul class="suggest" id="suggest" hidden role="listbox" aria-label="Suggestions"></ul>
    <form id="form">
      <button id="attach" class="attach" type="button" title="Files to go with your message" aria-label="Attach files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.5 12 20a5.5 5.5 0 0 1-7.8-7.8l8.5-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8"/></svg></button>
      <textarea id="text" rows="1" placeholder="Say something…" aria-label="Message"></textarea>
      <button id="send" type="submit" disabled aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg></button>
    </form>
  </div>
</div>
<script src="talk.js"></script>
</body>
</html>
